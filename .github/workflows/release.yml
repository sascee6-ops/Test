      - name: Stage 4
        shell: bash
        run: |
          tar -C "${RUNNER_TEMP}/stage" -czf "${RUNNER_TEMP}/x86_64-macOS-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1.tar.gz" x86_64-macOS-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1
      - name: Stage 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
