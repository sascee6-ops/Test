  archive_verification:
    name: Archive Verification (temporary)
    needs: [aarch64_linux, x86_64_linux, aarch64_macos, x86_64_macos, aarch64_windows, x86_64_windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Stage 0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: ${{ runner.temp }}/artifacts
      - name: Stage 1
        shell: bash
        run: |
          PYBIN="$(command -v python3 || command -v python)"
          "$PYBIN" - << 'PY'
          import hashlib, json, os, shutil, struct, sys, tarfile, zipfile
          def esc(m):
              return str(m).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")[:3800]
          def notice(title, msg):
              print("::notice title=" + title + "::" + esc(msg), flush=True)
          root = os.environ["RUNNER_TEMP"] + "/artifacts"
          EXPECT = [
              ("AArch64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1", "tar.gz", "", "elf", 0xB7),
              ("x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1", "tar.gz", "", "elf", 0x3E),
              ("AArch64-macOS-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1", "tar.gz", "", "macho", 0x100000C),
              ("x86_64-macOS-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1", "tar.gz", "", "macho", 0x1000007),
              ("AArch64-Windows-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1", "zip", ".exe", "pe", 0xAA64),
              ("x86_64-Windows-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1", "zip", ".exe", "pe", 0x8664),
          ]
          def arch_of(full, kind, aval):
              if kind == "elf":
                  assert full[:4] == b"\x7fELF", full[:8].hex()
                  machine = struct.unpack_from("<H", full, 18)[0]
                  assert machine == aval, hex(machine)
                  return "ELF e_machine " + hex(machine)
              if kind == "macho":
                  magic = struct.unpack_from("<I", full, 0)[0]
                  assert magic in (0xFEEDFACF, 0xCFFAEDFE), hex(magic)
                  cputype = struct.unpack_from("<I", full, 4)[0]
                  assert cputype == aval, hex(cputype)
                  return "Mach-O cputype " + hex(cputype)
              assert full[:2] == b"MZ", full[:2].hex()
              off = struct.unpack_from("<I", full, 0x3C)[0]
              assert full[off:off + 4] == b"PE\x00\x00", full[off:off + 4].hex()
              machine = struct.unpack_from("<H", full, off + 4)[0]
              assert machine == aval, hex(machine)
              return "PE machine " + hex(machine)
          def verify(job, aext, ext, kind, aval):
              d = os.path.join(root, job)
              got_files = sorted(os.listdir(d))
              assert got_files == [job + "." + aext], got_files
              arc = os.path.join(d, job + "." + aext)
              exe = job + ext
              assert os.path.getsize(arc) > 0, "archive empty"
              if aext == "tar.gz":
                  with tarfile.open(arc) as t:
                      ms = t.getmembers()
                      entries = [[m.name, m.isreg(), m.size, oct(m.mode & 0o777)] for m in ms]
                      assert len(ms) == 1, entries
                      m0 = ms[0]
                      assert m0.name == exe and m0.isreg() and m0.size > 0 and "/" not in m0.name, entries
                      assert m0.mode & 0o111, entries
              else:
                  with zipfile.ZipFile(arc) as z:
                      zs = z.infolist()
                      entries = [[i.filename, not i.is_dir(), i.file_size] for i in zs]
                      assert len(zs) == 1, entries
                      i0 = zs[0]
                      assert i0.filename == exe and not i0.is_dir() and i0.file_size > 0 and "/" not in i0.filename, entries
              vd = os.path.join(root, "extract_" + job.split("-Subsystem")[0])
              shutil.rmtree(vd, ignore_errors=True)
              os.makedirs(vd)
              if aext == "tar.gz":
                  with tarfile.open(arc) as t:
                      try:
                          t.extractall(vd, filter="data")
                      except TypeError:
                          t.extractall(vd)
              else:
                  with zipfile.ZipFile(arc) as z:
                      z.extractall(vd)
              got = sorted(os.listdir(vd))
              assert got == [exe], got
              assert not [e for e in got if os.path.isdir(os.path.join(vd, e))], got
              fx = os.path.join(vd, exe)
              full = open(fx, "rb").read()
              arch = arch_of(full, kind, aval)
              xok = None
              if aext == "tar.gz":
                  xok = os.access(fx, os.X_OK)
                  assert xok, "execute permission lost after extraction"
              return {"archive": os.path.basename(arc), "archive_bytes": os.path.getsize(arc),
                      "sha256": hashlib.sha256(open(arc, "rb").read()).hexdigest(),
                      "entries": entries, "extracted": got, "arch": arch, "exec_ok": xok, "exe_bytes": len(full)}
          fails = []
          results = {}
          for job, aext, ext, kind, aval in EXPECT:
              short = job.split("-Subsystem")[0].replace("-", "_")
              try:
                  res = verify(job, aext, ext, kind, aval)
                  results[short] = res
                  notice("PKG23_" + short, json.dumps(res))
              except AssertionError as e:
                  fails.append((short, repr(e)))
                  notice("PKG23_FAIL_" + short, repr(e))
          notice("PKG23_SUMMARY", json.dumps({"verified": sorted(results), "failed": [f[0] for f in fails],
              "exe_bytes": {k: v["exe_bytes"] for k, v in results.items()}}))
          assert not fails, fails
          print("archive verification complete")
          PY
