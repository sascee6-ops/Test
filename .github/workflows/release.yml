name: release

on:
  push:
    branches:
      - main
      - arena/784e0a1e-test
  workflow_dispatch:
    inputs:
      build_mode:
        description: release ships all six targets, debug builds the x86_64 Linux laboratory
        required: false
        default: release
        type: choice
        options:
          - release
          - debug

permissions:
  contents: read

jobs:

  aarch64_linux:
    name: AArch64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1
    runs-on: ubuntu-24.04-arm
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_mode != 'debug') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    timeout-minutes: 75
    steps:
      - name: Stage 0
        shell: bash
        run: |
          git init .
          git remote add origin https://github.com/sascee6-ops/Test.git
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Stage 1
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev
      - name: Stage 2
        shell: bash
        run: |
          rustup toolchain install nightly-2026-10-25 --profile minimal
          rustup target add aarch64-unknown-linux-gnu --toolchain nightly-2026-10-25
      - name: Stage 3
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_mode != 'debug') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        shell: bash
        run: |
          cargo +nightly-2026-10-25 build --quiet --locked \
            --release \
            --bin Subsystem-for-Arxumbra \
            --target aarch64-unknown-linux-gnu \
            --target-dir "${RUNNER_TEMP}/target" \
            --config 'build.incremental=false' \
            --config 'profile.release.opt-level=3' \
            --config 'profile.release.lto="fat"' \
            --config 'profile.release.codegen-units=1' \
            --config 'profile.release.panic="abort"' \
            --config 'profile.release.strip="symbols"' \
            --config 'profile.release.debug=false' \
            --config 'profile.release.overflow-checks=true'
      - name: Stage 4
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_mode != 'debug') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/stage"
          install -m 755 "${RUNNER_TEMP}/target/aarch64-unknown-linux-gnu/release/Subsystem-for-Arxumbra" "${RUNNER_TEMP}/stage/AArch64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1"
      - name: Stage 5
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_mode != 'debug') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        shell: bash
        run: |
          tar -czf "${RUNNER_TEMP}/AArch64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1.tar.gz" -C "${RUNNER_TEMP}/stage" "AArch64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1"
      - name: Stage 6
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_mode != 'debug') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: AArch64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1
          path: ${{ runner.temp }}/AArch64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1.tar.gz
          retention-days: 7
          if-no-files-found: error
  x86_64_linux:
    name: x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Stage 0
        shell: bash
        run: |
          git init .
          git remote add origin https://github.com/sascee6-ops/Test.git
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Stage 1
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev
      - name: Stage 2
        shell: bash
        run: |
          rustup toolchain install nightly-2026-10-25 --profile minimal
          rustup target add x86_64-unknown-linux-gnu --toolchain nightly-2026-10-25
      - name: Stage 3
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_mode != 'debug') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        shell: bash
        run: |
          cargo +nightly-2026-10-25 build --quiet --locked \
            --release \
            --bin Subsystem-for-Arxumbra \
            --target x86_64-unknown-linux-gnu \
            --target-dir "${RUNNER_TEMP}/target" \
            --config 'build.incremental=false' \
            --config 'profile.release.opt-level=3' \
            --config 'profile.release.lto="fat"' \
            --config 'profile.release.codegen-units=1' \
            --config 'profile.release.panic="abort"' \
            --config 'profile.release.strip="symbols"' \
            --config 'profile.release.debug=false' \
            --config 'profile.release.overflow-checks=true'
      - name: Stage 4
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_mode != 'debug') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/stage"
          install -m 755 "${RUNNER_TEMP}/target/x86_64-unknown-linux-gnu/release/Subsystem-for-Arxumbra" "${RUNNER_TEMP}/stage/x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1"
      - name: Stage 5
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_mode != 'debug') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        shell: bash
        run: |
          tar -czf "${RUNNER_TEMP}/x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1.tar.gz" -C "${RUNNER_TEMP}/stage" "x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1"
      - name: Stage 6
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_mode != 'debug') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1
          path: ${{ runner.temp }}/x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1.tar.gz
          retention-days: 7
          if-no-files-found: error
      - name: Stage 7
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_mode == 'debug') || (github.event_name == 'push' && github.ref == 'refs/heads/arena/784e0a1e-test') }}
        shell: bash
        run: |
          cargo +nightly-2026-10-25 build --quiet --locked \
            --bin Subsystem-for-Arxumbra \
            --target x86_64-unknown-linux-gnu \
            --target-dir "${RUNNER_TEMP}/target-debug" \
            --config 'build.incremental=false' \
            --config 'profile.dev.opt-level=0' \
            --config 'profile.dev.debug="line-tables-only"' \
            --config 'profile.dev.debug-assertions=true' \
            --config 'profile.dev.overflow-checks=true'
      - name: Stage 8
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_mode == 'debug') || (github.event_name == 'push' && github.ref == 'refs/heads/arena/784e0a1e-test') }}
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/stage-debug"
          install -m 755 "${RUNNER_TEMP}/target-debug/x86_64-unknown-linux-gnu/debug/Subsystem-for-Arxumbra" "${RUNNER_TEMP}/stage-debug/x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1-debug"
          tar -czf "${RUNNER_TEMP}/x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1-debug.tar.gz" -C "${RUNNER_TEMP}/stage-debug" "x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1-debug"
      - name: Stage 9
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_mode == 'debug') || (github.event_name == 'push' && github.ref == 'refs/heads/arena/784e0a1e-test') }}
        shell: bash
        run: |
          tar -tzvf "${RUNNER_TEMP}/x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1-debug.tar.gz"
          rm -rf "${RUNNER_TEMP}/verify-debug"
          mkdir -p "${RUNNER_TEMP}/verify-debug"
          tar -xzf "${RUNNER_TEMP}/x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1-debug.tar.gz" -C "${RUNNER_TEMP}/verify-debug"
          test -f "${RUNNER_TEMP}/verify-debug/x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1-debug"
          test -x "${RUNNER_TEMP}/verify-debug/x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1-debug"
          test -s "${RUNNER_TEMP}/verify-debug/x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1-debug"
          test "$(find "${RUNNER_TEMP}/verify-debug" -mindepth 1 | wc -l)" -eq 1
          file "${RUNNER_TEMP}/verify-debug/x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1-debug"
          ldd "${RUNNER_TEMP}/verify-debug/x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1-debug"
      - name: Stage 10
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_mode == 'debug') || (github.event_name == 'push' && github.ref == 'refs/heads/arena/784e0a1e-test') }}
        shell: bash
        run: |
          hb() { echo "::notice title=hb::$1"; }
          ck() { hb "ckpt=$1"; }
          NAME="x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1"
          BIN="${RUNNER_TEMP}/stage-debug/${NAME}-debug"
          RT="${RUNNER_TEMP}/runtime"
          rm -rf "${RT}"
          mkdir -p "${RT}/xdg" "${RT}/home/.config/sway" "${RT}/home/.local/share"
          chmod 700 "${RT}/xdg"
          export XDG_RUNTIME_DIR="${RT}/xdg"
          export HOME="${RT}/home"
          printf '%s\n' 'xwayland disable' 'output HEADLESS-1 resolution 1280x800' 'bar { swaybar_command /bin/true }' > "${HOME}/.config/sway/config"
          ck 1
          sudo apt-get update -y > "${RT}/apt.log" 2>&1 || hb "apt update rc=$?"
          sudo apt-get install -y --no-install-recommends sway wtype grim ydotool libegl1 libegl-mesa0 libgles2 libgl1 libgl1-mesa-dri mesa-libgallium libvulkan1 mesa-vulkan-drivers libxkbcommon0 imagemagick >> "${RT}/apt.log" 2>&1 || hb "apt install rc=$?"
          hb "tools sway=$(command -v sway) wtype=$(command -v wtype) grim=$(command -v grim) ydotool=$(command -v ydotool) convert=$(command -v convert)"
          ck 2
          WLR_BACKENDS=headless WLR_RENDERER_ALLOW_SOFTWARE=1 LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe sway -d -c "${HOME}/.config/sway/config" > "${RT}/sway.log" 2>&1 &
          SWAY_PID=$!
          SOCKET=""
          for _i in $(seq 1 60); do
            if [ -S "${XDG_RUNTIME_DIR}/wayland-1" ]; then SOCKET="${XDG_RUNTIME_DIR}/wayland-1"; break; fi
            sleep 0.5
          done
          hb "socket=${SOCKET:-none}"
          if [ -z "${SOCKET}" ]; then
            grep -E '\[(ERROR|FATAL)\]' "${RT}/sway.log" | tail -15 | while IFS= read -r line; do printf '::error title=sway::%s\n' "${line//%/%25}"; done
            exit 1
          fi
          export WAYLAND_DISPLAY=wayland-1
          export LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe
          sudo modprobe uinput 2>>"${RT}/ydo.log" || hb "modprobe rc=$?"
          sudo ydotoold --socket-path="${RT}/ydo.sock" >> "${RT}/ydo.log" 2>&1 &
          sleep 2
          sudo chmod 666 "${RT}/ydo.sock" 2>/dev/null || true
          ydo() { sudo ydotool --socket-path="${RT}/ydo.sock" "$@" >> "${RT}/ydo.log" 2>&1; }
          wt() { timeout 10 wtype "$@" >> "${RT}/wtype.log" 2>&1; }
          shot() {
            local b64=""
            timeout 20 grim -o HEADLESS-1 "${RT}/$1.png" 2>>"${RT}/grim.log" || hb "grim $1 rc=$?"
            b64=$(convert "${RT}/$1.png" -resize 200x125 -colorspace Gray -depth 8 png:- 2>/dev/null | base64 -w0)
            hb "shot $1 bytes=${#b64}"
            if [ -n "${b64}" ]; then echo "::notice title=shot-$1::${b64}"; fi
            return 0
          }
          relay() {
            tail -20 "$1" 2>/dev/null | while IFS= read -r line; do printf "::notice title=$2::%s\n" "${line//%/%25}"; done
            return 0
          }
          ck 3
          timeout 90 "${BIN}" > "${RT}/app1.log" 2>&1 &
          APP1=$!
          sleep 15
          hb "run1 alive=$(kill -0 ${APP1} 2>/dev/null && echo yes || echo no)"
          swaymsg -t get_tree 2>>"${RT}/swaymsg.log" | grep -oE '"(app_id|name)":"[^"]*","pid":[0-9]+|"focused":true' | head -8 | while IFS= read -r line; do printf '::notice title=tree::%s\n' "${line//%/%25}"; done
          ck 4
          shot home
          ck 5
          wt -P ctrl -P e -p e -p ctrl
          hb "wtype ctrl+e rc=$? ydo_alt_pending"
          ydo key 29:1 18:1 18:0 29:0
          hb "ydotool ctrl+e rc=$?"
          sleep 3
          ck 6
          shot wizard
          wt -s 40 'Arena Test'
          hb "wtype text rc=$?"
          ydo type 'Arena Test'
          hb "ydotool text rc=$?"
          sleep 3
          ck 7
          shot typed
          wt -P escape
          ydo key 1:1
          hb "escape held wtype+ydo rc=$?"
          sleep 7
          ck 8
          shot escaped
          hb "run1 alive after 7s escape=$(kill -0 ${APP1} 2>/dev/null && echo yes || echo no)"
          wt -p escape
          ydo key 1:0
          sleep 1
          kill ${APP1} 2>/dev/null || true
          wait ${APP1} 2>/dev/null
          hb "run1 exit_code=$?"
          relay "${RT}/app1.log" app1
          relay "${RT}/wtype.log" wtype
          relay "${RT}/ydo.log" ydo
          ck 9
          timeout 60 "${BIN}" > "${RT}/app2.log" 2>&1 &
          APP2=$!
          sleep 12
          hb "run2 alive=$(kill -0 ${APP2} 2>/dev/null && echo yes || echo no)"
          wt -P escape
          ydo key 1:1
          HOLD_EXIT="alive"
          for _i in $(seq 1 24); do
            if ! kill -0 ${APP2} 2>/dev/null; then HOLD_EXIT="exited"; break; fi
            sleep 0.5
          done
          wt -p escape
          ydo key 1:0
          sleep 1
          FINAL=$(kill -0 ${APP2} 2>/dev/null && echo alive || echo exited)
          wait ${APP2} 2>/dev/null
          RC2=$?
          hb "run2 escape_while_held=${HOLD_EXIT} after_release=${FINAL} exit_code=${RC2}"
          relay "${RT}/app2.log" app2
          ck 10
          kill ${SWAY_PID} 2>/dev/null || true
          if [ "${HOLD_EXIT}" != "exited" ]; then
            echo "::error title=runtime::continuing 7s Escape hold in Home did not exit the application"
          fi
          exit 0
      - name: Stage 11
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_mode == 'debug') || (github.event_name == 'push' && github.ref == 'refs/heads/arena/784e0a1e-test') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1-debug
          path: ${{ runner.temp }}/x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1-debug.tar.gz
          retention-days: 7
          if-no-files-found: error
