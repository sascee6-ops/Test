name: release

on:
  push:
    branches:
      - arena/2494d094-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux_acceptance:
    name: x86_64-Linux Acceptance Gate (temporary)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Stage 0
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Stage 1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwayland-dev libxkbcommon-dev \
            sway grim mesa-vulkan-drivers libwayland-client0 \
            python3-pil time file binutils >/dev/null
          sudo apt-get install -y --no-install-recommends libxkbcommon-utils xkb-data >/dev/null 2>&1 || true
          mkdir -p /tmp/ci-work/evidence /tmp/ci-work/isolated-run /tmp/arxumbra-debug
      - name: Stage 2
        run: |
          rustup toolchain install nightly-2026-10-25 --profile minimal --component rustfmt --component clippy >/dev/null 2>&1

          set +e
          cargo +nightly-2026-10-25 build \
            --bin Subsystem-for-Arxumbra \
            --target x86_64-unknown-linux-gnu \
            --release \
            --locked \
            --target-dir /tmp/ci-work/ctarget \
            --config 'build.incremental=false' \
            --config 'profile.release.opt-level=3' \
            --config 'profile.release.lto="fat"' \
            --config 'profile.release.codegen-units=1' \
            --config 'profile.release.panic="abort"' \
            --config 'profile.release.strip="symbols"' \
            --config 'profile.release.debug=false' \
            --config 'profile.release.overflow-checks=true' \
            > /tmp/ci-work/build.log 2>&1
          BUILD_CODE=$?
          set -e
          if [ "${BUILD_CODE}" -ne 0 ]; then
            python3 -c "t=open('/tmp/ci-work/build.log',errors='replace').read()[-3600:].replace('%','%25').replace('\r','%0D').replace('\n','%0A'); print(f'::notice title=BUILD_ERR::{t}')"
            exit "${BUILD_CODE}"
          fi

          cp /tmp/ci-work/ctarget/x86_64-unknown-linux-gnu/release/Subsystem-for-Arxumbra /tmp/ci-work/isolated-run/x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1
          chmod 755 /tmp/ci-work/isolated-run/x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1
      - name: Stage 3
        run: |
          exec 2> >(tee /tmp/ci-work/step_wl.err >&2)
          cat > /tmp/ci-work/err_trap.py << 'TRAP'
          import os
          t = open('/tmp/ci-work/step_wl.err', errors='replace').read()[-2200:]
          print('::notice title=STEP_WL_ERR::' + t.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          p = '/tmp/ci-work/remaster_stderr.bin'
          if os.path.exists(p):
              s = open(p, errors='replace').read()[-2200:]
              print('::notice title=APP_STDERR::' + s.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          p2 = '/tmp/ci-work/remaster_stdout.bin'
          if os.path.exists(p2):
              s2 = open(p2, errors='replace').read()[-600:]
              print('::notice title=APP_STDOUT::' + s2.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          TRAP
          sed -i 's/^          //' /tmp/ci-work/err_trap.py
          trap 'python3 /tmp/ci-work/err_trap.py' ERR
          set -euo pipefail

          python3 - << 'PY'
          import base64, json, os, subprocess, sys, time
          import threading, faulthandler, io as _io
          def _wd():
            time.sleep(480)
            buf = _io.StringIO()
            faulthandler.dump_traceback(file=buf)
            msg = buf.getvalue().replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
            print("::notice title=HANG_TRACE::" + msg[:3500], flush=True)
            time.sleep(120)
            buf2 = _io.StringIO()
            faulthandler.dump_traceback(file=buf2)
            msg2 = buf2.getvalue().replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
            print("::notice title=HANG_TRACE2::" + msg2[:3500], flush=True)
          threading.Thread(target=_wd, daemon=True).start()
          from PIL import Image

          ev = "/tmp/ci-work/evidence"
          rt_dir = "/tmp/ci-work/xdg-accept"
          os.makedirs(rt_dir, exist_ok=True)
          os.chmod(rt_dir, 0o700)

          dyn_out = subprocess.check_output(["readelf", "-d", "/tmp/ci-work/isolated-run/x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1"], text=True)
          needed_libs = [l.split("[")[1].split("]")[0] for l in dyn_out.splitlines() if "(NEEDED)" in l and "[" in l]

          sway_cfg = "/tmp/ci-work/sway_accept.cfg"
          with open(sway_cfg, "w") as f:
            f.write("xwayland disable\ndefault_border none\ndefault_floating_border none\noutput * bg #000000 solid_color\n")

          env = os.environ.copy()
          env.update({
            "XDG_RUNTIME_DIR": rt_dir,
            "WLR_BACKENDS": "headless",
            "WLR_LIBINPUT_NO_DEVICES": "1",
            "WLR_RENDERER": "pixman",
            "LIBGL_ALWAYS_SOFTWARE": "1",
          })
          env.pop("DISPLAY", None)

          sway = subprocess.Popen(["sway", "-c", sway_cfg], env=env, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          for _ in range(60):
            time.sleep(0.1)
            socks = [x for x in os.listdir(rt_dir) if x.startswith("wayland-") and not x.endswith(".lock")]
            swaysocks = [x for x in os.listdir(rt_dir) if x.startswith("sway-ipc.")]
            if socks and swaysocks:
              env["WAYLAND_DISPLAY"] = socks[0]
              env["SWAYSOCK"] = os.path.join(rt_dir, swaysocks[0])
              break

          subprocess.run(["swaymsg", "output", "HEADLESS-1", "resolution", "1920x1080", "scale", "1"], env=env, check=True)
          time.sleep(0.2)

          km_path = "/tmp/ci-work/keymap.xkb"
          import shutil
          if shutil.which("xkbcli"):
            with open(km_path, "wb") as kfm:
              subprocess.run(["xkbcli", "compile-keymap"], stdout=kfm, check=True)
          else:
            subprocess.run([sys.executable, "-m", "pip", "install", "--quiet", "--break-system-packages", "xkbcommon"], check=True)
            kms = subprocess.check_output([sys.executable, "-c", "from xkbcommon import xkb; ctx = xkb.Context(); km = ctx.keymap_new_from_names(); s = km.get_as_string() if hasattr(km, 'get_as_string') else km.as_string(); print(s)"], text=True)
            open(km_path, "w").write(kms)
          open("/tmp/ci-work/vkinj.py", "wb").write(base64.b64decode(""))

          out_path = "/tmp/ci-work/remaster_stdout.bin"
          err_path = "/tmp/ci-work/remaster_stderr.bin"
          out_f = open(out_path, "wb")
          err_f = open(err_path, "wb")

          app = subprocess.Popen(
            ["/tmp/ci-work/isolated-run/x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1"],
            cwd="/tmp/ci-work/isolated-run",
            env=env,
            stdout=out_f,
            stderr=err_f,
          )

          def app_focused():
            tree = json.loads(subprocess.check_output(["swaymsg", "-t", "get_tree"], env=env, text=True))
            node = find_app_node(tree)
            return bool(node and node.get("focused"))

          def find_app_node(node):
            if node.get("app_id") == "Subsystem-for-Arxumbra" or "Subsystem-for-Arxumbra" in (node.get("name") or ""):
              return node
            for k in ("nodes", "floating_nodes"):
              for ch in node.get(k, []):
                r = find_app_node(ch)
                if r:
                  return r
            return None

          app_node = None
          for _ in range(300):
            time.sleep(0.1)
            tree = json.loads(subprocess.check_output(["swaymsg", "-t", "get_tree"], env=env, text=True))
            app_node = find_app_node(tree)
            if app_node and app_node.get("focused"):
              break

          time.sleep(0.8)
          tree = json.loads(subprocess.check_output(["swaymsg", "-t", "get_tree"], env=env, text=True))
          app_node = find_app_node(tree) or app_node

          def grab(name):
            p = os.path.join(ev, name)
            subprocess.run(["grim", p], env=env, check=True)
            return Image.open(p).convert("RGB")

          def _scan(px, w, h, ys, xs):
            for y in ys:
              for x in xs:
                c = px[x, y]
                if c[0] < 250 or c[1] < 250 or c[2] < 250:
                  continue
                x0 = x
                while x0 - 1 >= 0 and px[x0 - 1, y][0] >= 250:
                  x0 -= 1
                x1 = x
                while x1 + 1 < w and px[x1 + 1, y][0] >= 250:
                  x1 += 1
                if not (7 <= x1 - x0 + 1 <= 11):
                  continue
                y0 = y
                while y0 - 1 >= 0 and px[x, y0 - 1][0] >= 250:
                  y0 -= 1
                y1 = y
                while y1 + 1 < h and px[x, y1 + 1][0] >= 250:
                  y1 += 1
                if not (7 <= y1 - y0 + 1 <= 11):
                  continue
                cx = (x0 + x1) // 2
                cy = (y0 + y1) // 2
                chord = sum(1 for dx in range(-8, 9) if 0 <= cx + dx < w and px[cx + dx, cy - 3][0] >= 250)
                if not (4 <= chord <= 14):
                  continue
                if px[cx - 7, cy][0] >= 250 or (cx + 7 < w and px[cx + 7, cy][0] >= 250):
                  continue
                if px[cx, cy - 7][0] >= 250 or (cy + 7 < h and px[cx, cy + 7][0] >= 250):
                  continue
                if px[cx - 5, cy - 5][0] >= 250 or (cx + 5 < w and px[cx + 5, cy - 5][0] >= 250):
                  continue
                if px[cx - 5, cy + 5][0] >= 250 or (cx + 5 < w and cy + 5 < h and px[cx + 5, cy + 5][0] >= 250):
                  continue
                return (cx, cy)
            return None

          LAST = [None]

          def find_dot_center(img):
            w, h = img.size
            px = img.load()
            if LAST[0]:
              hx, hy = LAST[0]
              r = _scan(px, w, h, range(max(0, hy - 260), min(h, hy + 260)), range(max(0, hx - 260), min(w, hx + 260)))
              if r:
                LAST[0] = r
                return r
            r = _scan(px, w, h, range(0, h), range(0, w))
            LAST[0] = r
            return r

          def dot_debug(img):
            w, h = img.size
            px = img.load()
            xs = []
            ys = []
            for y in range(0, h, 2):
              for x in range(500, w, 2):
                c = px[x, y]
                if c[0] >= 250 and c[1] >= 250 and c[2] >= 250:
                  xs.append(x)
                  ys.append(y)
            if not xs:
              return [0, -1, -1, -1, -1]
            return [len(xs), min(xs), max(xs), min(ys), max(ys)]

          PPM = [0.5]

          def calibrate_ppm():
            a = find_dot_center(grab("_cal1.png"))
            if not a:
              return
            yhold(["ctrl", "d"], 200)
            time.sleep(0.06)
            b = find_dot_center(grab("_cal2.png"))
            if a and b and b[0] > a[0] + 20:
              PPM[0] = min(3.0, max(0.2, (b[0] - a[0]) / 200.0))
              yhold(["ctrl", "a"], 200)
              time.sleep(0.06)
            for _ in range(4):
              c = find_dot_center(grab("_cal3.png"))
              if not c or (abs(c[0] - a[0]) <= 3 and abs(c[1] - a[1]) <= 3):
                break
              dx = a[0] - c[0]
              dy = a[1] - c[1]
              if abs(dx) > 3:
                yhold(["ctrl", "d" if dx > 0 else "a"], max(16, int(abs(dx) / PPM[0] * 0.7)))
              if abs(dy) > 3:
                yhold(["ctrl", "s" if dy > 0 else "w"], max(16, int(abs(dy) / PPM[0] * 0.7)))
              time.sleep(0.06)

          def move_dot_to(tx, ty):
            v = PPM[0] if PPM[0] else 1.5
            c = None
            for _ in range(24):
              im = grab("_probe.png")
              c = find_dot_center(im)
              if not c:
                break
              dx = tx - c[0]
              dy = ty - c[1]
              if abs(dx) <= 5 and abs(dy) <= 5:
                return c
              if abs(dx) > 5:
                ms = max(8, min(1400, int(abs(dx) / v * 0.9)))
                c0 = c[0]
                yhold(["ctrl", "d" if dx > 0 else "a"], ms)
                time.sleep(0.05)
                c2 = find_dot_center(grab("_probe.png"))
                if c2 and abs(c2[0] - c0) > 4:
                  v = max(0.6, min(3.0, abs(c2[0] - c0) / ms))
                c = c2 if c2 else c
                dy = ty - c[1]
              if abs(dy) > 5:
                ms = max(8, min(1400, int(abs(dy) / v * 0.9)))
                c0 = c[1]
                yhold(["ctrl", "s" if dy > 0 else "w"], ms)
                time.sleep(0.05)
                c2 = find_dot_center(grab("_probe.png"))
                if c2 and abs(c2[1] - c0) > 4:
                  v = max(0.6, min(3.0, abs(c2[1] - c0) / ms))
                c = c2 if c2 else c
            return c if c else find_dot_center(grab("_probe.png"))

          def goto(tx, ty):
            c = None
            for _ in range(3):
              c = move_dot_to(tx, ty)
              if c and abs(c[0] - tx) <= 6 and abs(c[1] - ty) <= 6:
                return c
            return c

          YD = {"ctrl": 29, "shift": 42, "alt": 56, "w": 17, "a": 30, "s": 31, "d": 32, "e": 18, "F1": 59, "Escape": 1, "Tab": 15, "Return": 28, "space": 57, "Right": 106}

          def inj_start():
            p = subprocess.Popen(
              ["python3", "/tmp/ci-work/vkinj.py"],
              env=env, stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True,
            )
            p.stdout.readline()
            return p

          INJ1 = inj_start()

          def ykey(*codes):
            toks = []
            for c in codes:
              n, st = c.split(":")
              toks.append(("d" if st == "d" else "u") + n)
            INJ1.stdin.write(" ".join(toks) + chr(10))
            INJ1.stdin.flush()
            INJ1.stdout.readline()

          def yhold(keys, ms):
            toks = ["d" + str(YD[k]) for k in keys] + ["s" + str(ms)] + ["u" + str(YD[k]) for k in reversed(keys)]
            INJ1.stdin.write(" ".join(toks) + chr(10))
            INJ1.stdin.flush()
            INJ1.stdout.readline()

          def yhold_bg_down(keys):
            INJ1.stdin.write(" ".join(["d" + str(YD[k]) for k in keys] + ["WAIT"] + ["u" + str(YD[k]) for k in reversed(keys)]) + chr(10))
            INJ1.stdin.flush()
            INJ1.stdout.readline()
            return INJ1

          def yup(keys):
            INJ1.stdin.write(chr(10))
            INJ1.stdin.flush()
            INJ1.stdout.readline()

          def ctrl_e():
            ykey("29:d")
            time.sleep(0.04)
            ykey("18:d")
            time.sleep(0.05)
            ykey("18:u")
            time.sleep(0.04)
            ykey("29:u")
            time.sleep(0.32)
            time.sleep(0.32)

          tests = {"elf_dt_needed": needed_libs, "zero_x11_dt_needed": all("X11" not in l and "xcb" not in l for l in needed_libs)}

          def emit_debug_shots():
            import base64
            for shot in ["after_home.png", "_probe.png", "_seq.png", "_stop2.png", "_redraw.png", "_diag.png", "_clamp_br.png", "_opp.png"]:
              p = os.path.join(ev, shot)
              if os.path.exists(p):
                im = Image.open(p).resize((960, 540), Image.Resampling.LANCZOS).convert("L")
                op = os.path.join(ev, "dbg_" + shot)
                im.save(op, format="PNG", optimize=True, compress_level=9)
                base64.b64encode(open(op, "rb").read()).decode("ascii")

          tree = json.loads(subprocess.check_output(["swaymsg", "-t", "get_tree"], env=env, text=True))
          app_node = find_app_node(tree)
          tests["wayland_native_xdg_shell"] = (
            app_node is not None
            and app_node.get("shell") == "xdg_shell"
            and app_node.get("fullscreen_mode") == 1
            and app_node.get("rect", {}).get("width") == 1920
            and app_node.get("rect", {}).get("height") == 1080
            and app_node.get("deco_rect", {}).get("height", 0) == 0
          )
          tests["window_title"] = app_node.get("name") if app_node else None

          def cpu_ticks(pid):
            st = open(f"/proc/{pid}/stat").read().split(")")[1].split()
            return int(st[11]) + int(st[12])
          time.sleep(0.4)
          t_cpu0 = cpu_ticks(app.pid)
          time.sleep(2.0)
          t_cpu1 = cpu_ticks(app.pid)
          tests["settled_idle_2s_cpu_ticks_delta"] = t_cpu1 - t_cpu0
          tests["settled_idle_zero_spin"] = (t_cpu1 - t_cpu0) <= 2

          tests["focus_at_start"] = app_focused()
          tests["focus_samples_idle"] = [app_focused() for _ in range(12)]
          tests["dot_blink_idle"] = [find_dot_center(grab("_blink.png")) for _ in range(6)]
          home_img = grab("after_home.png")
          init_dot = find_dot_center(home_img)
          tests["initial_dot_center"] = init_dot
          tests["initial_dot_centered"] = (init_dot is not None and abs(init_dot[0] - 960) <= 2 and abs(init_dot[1] - 540) <= 2)

          bg_rgb = home_img.getpixel((1500, 540))
          sidebar_right_x = max((x for x in range(600) if home_img.getpixel((x, 540))[0] > bg_rgb[0] + 4), default=-1)
          tl_rgb = home_img.getpixel((0, 0))
          bl_rgb = home_img.getpixel((0, 1079))
          tr_outer_rgb = home_img.getpixel((sidebar_right_x, 0))
          br_outer_rgb = home_img.getpixel((sidebar_right_x, 1079))
          tr_inner_rgb = home_img.getpixel((sidebar_right_x - 16, 16))
          tests["sidebar_width_px"] = sidebar_right_x + 1
          tests["sidebar_left_corners_flush"] = (tl_rgb[0] > bg_rgb[0] + 5 and bl_rgb[0] > bg_rgb[0] + 5)
          tests["sidebar_right_corners_rounded"] = (tr_outer_rgb == bg_rgb and br_outer_rgb == bg_rgb and tr_inner_rgb[0] > bg_rgb[0] + 5)

          calibrate_ppm()
          base_dot = find_dot_center(grab("_base.png"))
          yhold(["d"], 150)
          ykey("18:d")
          time.sleep(0.05)
          ykey("18:u")
          ykey("15:d")
          time.sleep(0.05)
          ykey("15:u")
          ykey("28:d")
          time.sleep(0.05)
          ykey("28:u")
          ykey("57:d")
          time.sleep(0.05)
          ykey("57:u")
          ykey("106:d")
          time.sleep(0.05)
          ykey("106:u")
          yhold(["ctrl", "shift", "d"], 180)
          yhold(["ctrl", "alt", "s"], 180)
          subprocess.run(["swaymsg", "seat", "seat0", "cursor", "move", "190", "172"], env=env, check=True)
          subprocess.run(["swaymsg", "seat", "seat0", "cursor", "press", "button1"], env=env, check=True)
          subprocess.run(["swaymsg", "seat", "seat0", "cursor", "release", "button1"], env=env, check=True)
          time.sleep(0.15)
          after_forbidden = grab("_after_forbidden.png")
          tests["dbg_bbox_forbidden"] = dot_debug(after_forbidden)
          tests["forbidden_inputs_ignored"] = (find_dot_center(after_forbidden) == base_dot and after_forbidden.getpixel((900, 60)) == bg_rgb)

          pos_before_opp = find_dot_center(grab("_preopp.png"))
          yhold(["ctrl", "a", "d"], 220)
          time.sleep(0.08)
          opp_img = grab("_opp.png")
          pos_opp = find_dot_center(opp_img)
          tests["dbg_bbox_opp"] = dot_debug(opp_img)
          tests["opposing_keys_cancel"] = (pos_opp == pos_before_opp and pos_before_opp == base_dot)

          yhold_bg_down(["ctrl", "d"])
          seq_x = []
          for _ in range(4):
            time.sleep(0.075)
            c = find_dot_center(grab("_seq.png"))
            if c:
              seq_x.append(c[0])
          yup(["ctrl", "d"])
          time.sleep(0.04)
          s1_img = grab("_stop1.png")
          stop_1 = find_dot_center(s1_img)
          tests["dbg_bbox_stop1"] = dot_debug(s1_img)
          time.sleep(0.18)
          s2_img = grab("_stop2.png")
          stop_2 = find_dot_center(s2_img)
          tests["dbg_bbox_stop2"] = dot_debug(s2_img)
          ykey("106:d")
          time.sleep(0.05)
          ykey("106:u")
          time.sleep(0.35)
          rd_img = grab("_redraw.png")
          tests["dbg_bbox_redraw"] = dot_debug(rd_img)
          time.sleep(0.5)
          rd2_img = grab("_redraw2.png")
          tests["dbg_bbox_redraw2"] = dot_debug(rd2_img)
          tests["smooth_cardinal_positions"] = seq_x
          tests["smooth_monotonic_motion"] = (len(seq_x) >= 3 and all(seq_x[i] < seq_x[i+1] for i in range(len(seq_x)-1)))
          tests["immediate_stop_zero_drift"] = (stop_1 is not None and stop_1 == stop_2)

          diag_start = stop_2
          yhold(["ctrl", "w", "d"], 260)
          time.sleep(0.06)
          dg_img = grab("_diag.png")
          diag_end = find_dot_center(dg_img)
          tests["dbg_bbox_diag"] = dot_debug(dg_img)
          ddx = diag_end[0] - diag_start[0] if diag_end and diag_start else -999
          ddy = diag_start[1] - diag_end[1] if diag_end and diag_start else -999
          tests["diagonal_displacement"] = [ddx, ddy]
          tests["diagonal_normalized"] = (ddx > 40 and ddy > 40 and abs(ddx - ddy) <= 14)
          hold_xs = []
          yhold_bg_down(["ctrl", "d"])
          for _ in range(11):
            time.sleep(0.3)
            c = find_dot_center(grab("_hold3s.png"))
            if c:
              hold_xs.append(c[0])
          yup(["ctrl", "d"])
          tests["hold3s_ctrl_d_updates"] = sum(1 for i in range(1, len(hold_xs)) if hold_xs[i] > hold_xs[i - 1] + 2)
          tests["hold3s_first_last"] = [hold_xs[0] if hold_xs else None, hold_xs[-1] if hold_xs else None]

          yhold(["ctrl", "d", "s"], 1900)
          time.sleep(0.08)
          cb_img = grab("_clamp_br.png")
          clamp_br = find_dot_center(cb_img)
          tests["dbg_bbox_clamp"] = dot_debug(cb_img)
