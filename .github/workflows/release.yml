name: release

on:
  push:
    branches:
      - main
      - arena/784e0a1e-test
  workflow_dispatch:
    inputs:
      build_mode:
        description: release ships all six targets, debug builds the x86_64 Linux laboratory
        required: false
        default: release
        type: choice
        options:
          - release
          - debug

permissions:
  contents: read

jobs:

  aarch64_linux:
    name: AArch64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1
    runs-on: ubuntu-24.04-arm
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_mode != 'debug') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    timeout-minutes: 75
    steps:
      - name: Stage 0
        shell: bash
        run: |
          git init .
          git remote add origin https://github.com/sascee6-ops/Test.git
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Stage 1
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev
      - name: Stage 2
        shell: bash
        run: |
          rustup toolchain install nightly-2026-10-25 --profile minimal
          rustup target add aarch64-unknown-linux-gnu --toolchain nightly-2026-10-25
      - name: Stage 3
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_mode != 'debug') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        shell: bash
        run: |
          cargo +nightly-2026-10-25 build --quiet --locked \
            --release \
            --bin Subsystem-for-Arxumbra \
            --target aarch64-unknown-linux-gnu \
            --target-dir "${RUNNER_TEMP}/target" \
            --config 'build.incremental=false' \
            --config 'profile.release.opt-level=3' \
            --config 'profile.release.lto="fat"' \
            --config 'profile.release.codegen-units=1' \
            --config 'profile.release.panic="abort"' \
            --config 'profile.release.strip="symbols"' \
            --config 'profile.release.debug=false' \
            --config 'profile.release.overflow-checks=true'
      - name: Stage 4
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_mode != 'debug') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/stage"
          install -m 755 "${RUNNER_TEMP}/target/aarch64-unknown-linux-gnu/release/Subsystem-for-Arxumbra" "${RUNNER_TEMP}/stage/AArch64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1"
      - name: Stage 5
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_mode != 'debug') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        shell: bash
        run: |
          tar -czf "${RUNNER_TEMP}/AArch64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1.tar.gz" -C "${RUNNER_TEMP}/stage" "AArch64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1"
      - name: Stage 6
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_mode != 'debug') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: AArch64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1
          path: ${{ runner.temp }}/AArch64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1.tar.gz
          retention-days: 7
          if-no-files-found: error
  x86_64_linux:
    name: x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Stage 0
        shell: bash
        run: |
          git init .
          git remote add origin https://github.com/sascee6-ops/Test.git
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Stage 1
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev
      - name: Stage 2
        shell: bash
        run: |
          rustup toolchain install nightly-2026-10-25 --profile minimal
          rustup target add x86_64-unknown-linux-gnu --toolchain nightly-2026-10-25
      - name: Stage 3
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_mode != 'debug') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        shell: bash
        run: |
          cargo +nightly-2026-10-25 build --quiet --locked \
            --release \
            --bin Subsystem-for-Arxumbra \
            --target x86_64-unknown-linux-gnu \
            --target-dir "${RUNNER_TEMP}/target" \
            --config 'build.incremental=false' \
            --config 'profile.release.opt-level=3' \
            --config 'profile.release.lto="fat"' \
            --config 'profile.release.codegen-units=1' \
            --config 'profile.release.panic="abort"' \
            --config 'profile.release.strip="symbols"' \
            --config 'profile.release.debug=false' \
            --config 'profile.release.overflow-checks=true'
      - name: Stage 4
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_mode != 'debug') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/stage"
          install -m 755 "${RUNNER_TEMP}/target/x86_64-unknown-linux-gnu/release/Subsystem-for-Arxumbra" "${RUNNER_TEMP}/stage/x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1"
      - name: Stage 5
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_mode != 'debug') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        shell: bash
        run: |
          tar -czf "${RUNNER_TEMP}/x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1.tar.gz" -C "${RUNNER_TEMP}/stage" "x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1"
      - name: Stage 6
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_mode != 'debug') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1
          path: ${{ runner.temp }}/x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1.tar.gz
          retention-days: 7
          if-no-files-found: error
      - name: Stage 7
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_mode == 'debug') || (github.event_name == 'push' && github.ref == 'refs/heads/arena/784e0a1e-test') }}
        shell: bash
        run: |
          set +e
          cargo +nightly-2026-10-25 build --locked \
            --bin Subsystem-for-Arxumbra \
            --target x86_64-unknown-linux-gnu \
            --target-dir "${RUNNER_TEMP}/target-debug" \
            --config 'build.incremental=false' \
            --config 'profile.dev.opt-level=0' \
            --config 'profile.dev.debug="line-tables-only"' \
            --config 'profile.dev.debug-assertions=true' \
            --config 'profile.dev.overflow-checks=true' > "${RUNNER_TEMP}/build-debug.log" 2>&1
          RC=$?
          if [ "${RC}" != "0" ]; then
            grep -aE 'error(\[E[0-9]+\])?:|-->|expected|found' "${RUNNER_TEMP}/build-debug.log" | head -14 | tr -d '\000-\010\013\014\016-\037' | cut -c1-190 | sed 's/%/%25/g' | paste -sd '~' - | sed 's/~/%0A/g' | while IFS= read -r msg; do echo "::notice title=build-errors::${msg}"; done
          fi
          exit ${RC}
      - name: Stage 8
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_mode == 'debug') || (github.event_name == 'push' && github.ref == 'refs/heads/arena/784e0a1e-test') }}
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/stage-debug"
          install -m 755 "${RUNNER_TEMP}/target-debug/x86_64-unknown-linux-gnu/debug/Subsystem-for-Arxumbra" "${RUNNER_TEMP}/stage-debug/x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1-debug"
          tar -czf "${RUNNER_TEMP}/x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1-debug.tar.gz" -C "${RUNNER_TEMP}/stage-debug" "x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1-debug"
      - name: Stage 9
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_mode == 'debug') || (github.event_name == 'push' && github.ref == 'refs/heads/arena/784e0a1e-test') }}
        shell: bash
        run: |
          tar -tzvf "${RUNNER_TEMP}/x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1-debug.tar.gz"
          rm -rf "${RUNNER_TEMP}/verify-debug"
          mkdir -p "${RUNNER_TEMP}/verify-debug"
          tar -xzf "${RUNNER_TEMP}/x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1-debug.tar.gz" -C "${RUNNER_TEMP}/verify-debug"
          test -f "${RUNNER_TEMP}/verify-debug/x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1-debug"
          test -x "${RUNNER_TEMP}/verify-debug/x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1-debug"
          test -s "${RUNNER_TEMP}/verify-debug/x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1-debug"
          test "$(find "${RUNNER_TEMP}/verify-debug" -mindepth 1 | wc -l)" -eq 1
          file "${RUNNER_TEMP}/verify-debug/x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1-debug"
          ldd "${RUNNER_TEMP}/verify-debug/x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1-debug"
      - name: Stage 10
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_mode == 'debug') || (github.event_name == 'push' && github.ref == 'refs/heads/arena/784e0a1e-test') }}
        shell: bash
        run: |
          set +e +o pipefail
          hb() { echo "::notice title=hb::$1"; }
          NAME="x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1"
          BIN="${RUNNER_TEMP}/stage-debug/${NAME}-debug"
          RT="${RUNNER_TEMP}/runtime"
          rm -rf "${RT}"
          mkdir -p "${RT}"
          sudo apt-get update -y > "${RT}/apt.log" 2>&1 || echo "apt update rc=$?" >> "${RT}/panics"
          sudo apt-get install -y --no-install-recommends sway grim libegl1 libegl-mesa0 libgles2 libgl1 libgl1-mesa-dri mesa-libgallium libvulkan1 mesa-vulkan-drivers libxkbcommon0 imagemagick >> "${RT}/apt.log" 2>&1 || echo "apt install rc=$?" >> "${RT}/panics"
          shot() {
            case "$1" in wizard|invalid) ;; *) return 0;; esac
            local b64=""
            timeout 20 grim -o HEADLESS-1 "${RT}/$1.png" 2>>"${RT}/grim.log"
            b64=$(convert "${RT}/$1.png" -resize 224x134 -colorspace Gray -depth 8 png:- 2>/dev/null | base64 -w0)
            if [ -n "${b64}" ]; then echo "::notice title=shot-$1::${b64}"; fi
            return 0
          }
          rawshot() {
            timeout 20 grim -o HEADLESS-1 "${RT}/$1.png" 2>>"${RT}/grim.log"
            return 0
          }
          for CASE in home registry workspace catalog wizard wizardgui invalid motion stepmid guimid dismissmid; do
            XD="${RT}/xdg-${CASE}"
            HM="${RT}/home-${CASE}"
            mkdir -p "${XD}" "${HM}/.config/sway"
            chmod 700 "${XD}"
            printf '%s\n' 'xwayland disable' 'output HEADLESS-1 resolution 1280x768' 'bar { swaybar_command /bin/true }' 'for_window [title=".*"] focus' 'focus_on_window_activation focus' > "${HM}/.config/sway/config"
            XDG_RUNTIME_DIR="${XD}" HOME="${HM}" WAYLAND_DISPLAY=wayland-1 WLR_BACKENDS=headless WLR_RENDERER_ALLOW_SOFTWARE=1 LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe sway -d -c "${HM}/.config/sway/config" > "${RT}/sway-${CASE}.log" 2>&1 &
            SP=$!
            for _i in $(seq 1 60); do
              if [ -S "${XD}/wayland-1" ]; then break; fi
              sleep 0.5
            done
            if [ "${CASE}" = "home" ]; then unset ARXUMBRA_PROBE; else export ARXUMBRA_PROBE="${CASE}"; fi
            if [ "${CASE}" = "wizardgui" ] && [ -s "${HM}/.local/share/Subsystem-for-Arxumbra/workspace-catalog" ]; then
              echo "save wrote catalog yes" >> "${RT}/verdicts"
            fi
            if [ "${CASE}" = "catalog" ]; then
              mkdir -p "${HM}/.local/share/Subsystem-for-Arxumbra"
              printf '%s\n' 'arxumbra-workspace-catalog v1' '3' '1|0|54656c656d6574727920526967|1|0' '2|1|556e6974792054657374|2|0' '3|0|56756c6b616e204c6f61646572|3|1' > "${HM}/.local/share/Subsystem-for-Arxumbra/workspace-catalog"
            fi
            export ARXUMBRA_PROBE_MARK="${RT}/mark-${CASE}"
            rm -f "${RT}/mark-${CASE}"
            XDG_RUNTIME_DIR="${XD}" HOME="${HM}" WAYLAND_DISPLAY=wayland-1 LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe timeout 60 "${BIN}" > "${RT}/app-${CASE}.log" 2>&1 &
            AP=$!
            if [ "${CASE}" = "motion" ] || [ "${CASE}" = "stepmid" ] || [ "${CASE}" = "guimid" ] || [ "${CASE}" = "dismissmid" ]; then
              _w=0
              for _w in $(seq 1 400); do
                if [ -f "${RT}/mark-${CASE}" ]; then break; fi
                sleep 0.05
              done
              echo "${CASE} markwait=${_w} mark=$(cat "${RT}/mark-${CASE}" 2>/dev/null)" >> "${RT}/verdicts"
              XDG_RUNTIME_DIR="${XD}" HOME="${HM}" WAYLAND_DISPLAY=wayland-1 rawshot "${CASE}a"
              sleep 0.15
              XDG_RUNTIME_DIR="${XD}" HOME="${HM}" WAYLAND_DISPLAY=wayland-1 rawshot "${CASE}b"
              sleep 0.15
              XDG_RUNTIME_DIR="${XD}" HOME="${HM}" WAYLAND_DISPLAY=wayland-1 rawshot "${CASE}c"
              cp "${RT}/${CASE}b.png" "${RT}/motionmid.png" 2>/dev/null || true
              if [ "${CASE}" != "motion" ]; then cp "${RT}/${CASE}b.png" "${RT}/${CASE}.png" 2>/dev/null || true; fi
              if [ "${CASE}" = "stepmid" ]; then
                cp "${RT}/${CASE}a.png" "${RT}/stepmida.png" 2>/dev/null || true
                cp "${RT}/${CASE}c.png" "${RT}/stepmidc.png" 2>/dev/null || true
              fi
            else
              sleep 20
              XDG_RUNTIME_DIR="${XD}" HOME="${HM}" WAYLAND_DISPLAY=wayland-1 shot "${CASE}"
            fi
            AL=$(kill -0 ${AP} 2>/dev/null && echo yes || echo no)
            echo "${CASE} ${AL}" >> "${RT}/verdicts"
            grep -aE 'panicked|ERROR' "${RT}/app-${CASE}.log" | head -4 | tr -d '\000-\010\013\014\016-\037' | cut -c1-180 | sed "s/^/${CASE} panic: /" >> "${RT}/panics" || true
            kill ${AP} 2>/dev/null || true
            wait ${AP} 2>/dev/null || true
            kill ${SP} 2>/dev/null || true
            wait ${SP} 2>/dev/null || true
          done
          unset ARXUMBRA_PROBE
          if [ -s "${RT}/motionmid.png" ]; then
            b64=$(convert "${RT}/motionmid.png" -resize 224x134 -colorspace Gray -depth 8 png:- 2>/dev/null | base64 -w0)
            if [ -n "${b64}" ]; then echo "::notice title=shot-motionmid::${b64}"; fi
          fi
          for M in motionmid stepmid stepmida stepmidc guimid dismissmid; do
            if [ -s "${RT}/${M}.png" ]; then
              b64=$(convert "${RT}/${M}.png" -resize 224x134 -colorspace Gray -depth 8 png:- 2>/dev/null | base64 -w0)
              if [ -n "${b64}" ]; then echo "::notice title=shot-${M}::${b64}"; fi
            fi
          done
          {
            if [ -s "${RT}/verdicts" ]; then sed 's/^/alive: /' "${RT}/verdicts"; else echo "alive: none"; fi
            if [ -s "${RT}/panics" ]; then cut -c1-120 "${RT}/panics" | head -4; else echo "no panic or error lines in any app log"; fi
          } | tr -d '\000-\010\013\014\016-\037' | cut -c1-220 | sed 's/%/%25/g' | paste -sd '~' - | sed 's/~/%0A/g' | while IFS= read -r msg; do echo "::notice title=probe-report::${msg}"; done
          if [ "$(grep -c '^home yes' "${RT}/verdicts" 2>/dev/null)" != "1" ]; then
            echo "::error title=runtime::application did not stay alive under headless Wayland"
          fi
          exit 0
      - name: Stage 11
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_mode == 'debug') || (github.event_name == 'push' && github.ref == 'refs/heads/arena/784e0a1e-test') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1-debug
          path: ${{ runner.temp }}/x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1-debug.tar.gz
          retention-days: 7
          if-no-files-found: error
  aarch64_macos:
    name: AArch64-macOS-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1
    runs-on: macos-15
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_mode != 'debug') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
