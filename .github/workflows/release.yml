name: Етап 0

on:
  push:
    branches:
      - arena/2494d094-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distribution:
    name: Етап 1
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: AArch64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            extension: ""
          - artifact: x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            extension: ""
          - artifact: AArch64-macOS-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1
            runner: macos-15
            target: aarch64-apple-darwin
            extension: ""
          - artifact: x86_64-macOS-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1
            runner: macos-15-intel
            target: x86_64-apple-darwin
            extension: ""
          - artifact: AArch64-Windows-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            extension: .exe
          - artifact: x86_64-Windows-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            extension: .exe
    steps:
      - name: Етап 2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Етап 3
        shell: bash
        run: |
          set -e
          CIW="${RUNNER_TEMP}/ci-work"
          mkdir -p "${CIW}/dist" "${CIW}/stage"
          case "${{ matrix.runner }}" in
            ubuntu*)
              sudo apt-get update -qq >/dev/null 2>&1
              sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev >/dev/null 2>&1
              ;;
          esac
          set +e
          rustup toolchain install nightly-2026-10-25 --profile minimal --component rustc --component cargo --component rust-std > "${CIW}/rustup.log" 2>&1
          RC=$?
          rustup target add "${{ matrix.target }}" --toolchain nightly-2026-10-25 >> "${CIW}/rustup.log" 2>&1
          RC2=$?
          set -e
          if [ "${RC}" -ne 0 ] || [ "${RC2}" -ne 0 ]; then
            PYBIN="$(command -v python3 || command -v python)"
            "$PYBIN" - "${CIW}/rustup.log" << 'PY'
          import sys
          t = open(sys.argv[1], errors="replace").read()[-3500:].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::notice title=TOOLCHAIN_ERR_MATRIX::" + t)
          PY
            exit 1
          fi
          set +e
          cargo +nightly-2026-10-25 build \
            --bin Subsystem-for-Arxumbra \
            --target "${{ matrix.target }}" \
            --release \
            --locked \
            --target-dir "${CIW}/ctarget" \
            --config 'build.incremental=false' \
            --config 'build.jobs=4' \
            --config 'profile.release.opt-level=3' \
            --config 'profile.release.lto="fat"' \
            --config 'profile.release.codegen-units=1' \
            --config 'profile.release.panic="abort"' \
            --config 'profile.release.strip="symbols"' \
            --config 'profile.release.debug=false' \
            --config 'profile.release.overflow-checks=true' \
            > "${CIW}/build_${{ matrix.target }}.log" 2>&1
          BC=$?
          set -e
          if [ "${BC}" -ne 0 ]; then
            PYBIN="$(command -v python3 || command -v python)"
            "$PYBIN" - "${CIW}/build_${{ matrix.target }}.log" << 'PY'
          import sys
          t = open(sys.argv[1], errors="replace").read()[-3500:].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::notice title=BUILD_ERR_MATRIX::" + t)
          PY
            exit "${BC}"
          fi
          cp "${CIW}/ctarget/${{ matrix.target }}/release/Subsystem-for-Arxumbra${{ matrix.extension }}" "${CIW}/stage/Subsystem-for-Arxumbra${{ matrix.extension }}"
          if [ -z "${{ matrix.extension }}" ]; then
            chmod 755 "${CIW}/stage/Subsystem-for-Arxumbra"
          fi
          cd "${CIW}/stage"
          PYBIN="$(command -v python3 || command -v python)"
          "$PYBIN" - "${{ matrix.artifact }}" "${{ matrix.extension }}" "${CIW}" << 'PY'
          import os, sys, tarfile, zipfile
          art, ext, ciw = sys.argv[1], sys.argv[2], sys.argv[3]
          dist = os.path.join(ciw, "dist")
          exe = "Subsystem-for-Arxumbra" + ext
          if ext == "":
            with tarfile.open(os.path.join(dist, art + ".tar.gz"), "w:gz") as t:
              t.add(exe, arcname=exe)
          else:
            with zipfile.ZipFile(os.path.join(dist, art + ".zip"), "w", zipfile.ZIP_DEFLATED) as z:
              z.write(exe, arcname=exe)
          p = os.path.join(dist, art + (".tar.gz" if ext == "" else ".zip"))
          print("archive:", p, os.path.getsize(p))
          PY
          "$PYBIN" - "${{ matrix.artifact }}" "${{ matrix.extension }}" "${CIW}" << 'PY'
          import hashlib, os, sys, tarfile, zipfile
          art, ext, ciw = sys.argv[1], sys.argv[2], sys.argv[3]
          p = os.path.join(ciw, "dist", art + (".tar.gz" if ext == "" else ".zip"))
          if ext == "":
            with tarfile.open(p) as t:
              names = [(m.name, oct(m.mode & 0o777), m.size) for m in t.getmembers()]
          else:
            with zipfile.ZipFile(p) as z:
              names = [(i.filename, oct(i.external_attr >> 16 & 0o777), i.file_size) for i in z.infolist()]
          h = hashlib.sha256(open(p, "rb").read()).hexdigest()
          msg = str({"archive": os.path.basename(p), "sha256": h, "contents": names}).replace("%", "%25")
          print("::notice title=PKG_INSPECT_" + art.split("-")[0] + "_" + art.split("-")[1] + "::" + msg)
          PY

      - name: Етап 4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/ci-work/dist/
          retention-days: 7
          if-no-files-found: error
