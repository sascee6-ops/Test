name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  investigate-and-verify:
    name: Controlled Experiments & Native Wayland Verification
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout repository with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install native Wayland & headless Vulkan test packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            sway grim wtype jq time mesa-vulkan-drivers vulkan-tools python3-pil

      - name: Select latest verified dated nightly & run inexpensive static checks
        run: |
          set -euo pipefail
          mkdir -p /tmp/ci-work/evidence
          SELECTED_TC=""
          for d in 2026-10-24 2026-10-23 2026-10-22 2026-10-21 2026-10-20 2026-10-19; do
            TC="nightly-${d}"
            if rustup toolchain install "${TC}" --profile minimal \
              --component rustfmt --component clippy \
              --target aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu \
                       aarch64-apple-darwin x86_64-apple-darwin \
                       aarch64-pc-windows-msvc x86_64-pc-windows-msvc >/tmp/ci-work/tc_${d}.log 2>&1; then
              SELECTED_TC="${TC}"
              break
            fi
          done
          test -n "${SELECTED_TC}"
          echo "${SELECTED_TC}" > /tmp/ci-work/selected_tc.txt

          cargo +"${SELECTED_TC}" fmt --all -- --check
          cargo +"${SELECTED_TC}" metadata --format-version 1 --no-deps --locked > /tmp/ci-work/metadata.json
          cargo +"${SELECTED_TC}" clippy --locked --target x86_64-unknown-linux-gnu -- -D warnings

          python3 - << 'PY'
          import json, subprocess

          tc = open("/tmp/ci-work/selected_tc.txt").read().strip()
          meta = json.load(open("/tmp/ci-work/metadata.json"))
          pkg = meta["packages"][0]
          targets = [(t["name"], t["kind"]) for t in pkg["targets"]]
          rustc_vv = subprocess.check_output(["rustc", f"+{tc}", "-Vv"], text=True).strip()
          cargo_vv = subprocess.check_output(["cargo", f"+{tc}", "-Vv"], text=True).strip()
          log_chk = subprocess.run(["cargo", f"+{tc}", "tree", "--locked", "-i", "bevy_log"], capture_output=True, text=True)
          x11_chk = subprocess.run(["cargo", f"+{tc}", "tree", "--locked", "-i", "x11rb"], capture_output=True, text=True)

          candidates = [
            "-Zmir-opt-level=3",
            "-Zmir-opt-level=4",
            "-Zinline-mir=yes",
            "-Zflatten-format-args=yes",
            "-Csymbol-mangling-version=v0",
            "-Clink-arg=-Wl,--gc-sections",
          ]
          flag_probe = {}
          verified_flags = []
          for fl in candidates:
            r = subprocess.run(
                ["rustc", f"+{tc}", "--edition=2024", "--crate-type=bin", fl, "-", "-o", "/tmp/ci-work/probe_bin"],
                input="fn main() {}\n",
                capture_output=True,
                text=True,
            )
            flag_probe[fl] = (r.returncode == 0)
          if flag_probe.get("-Zmir-opt-level=3"):
            verified_flags.append("-Zmir-opt-level=3")
          for fl in ["-Zinline-mir=yes", "-Zflatten-format-args=yes", "-Csymbol-mangling-version=v0", "-Clink-arg=-Wl,--gc-sections"]:
            if flag_probe.get(fl):
                verified_flags.append(fl)

          open("/tmp/ci-work/verified_rustflags.json", "w").write(json.dumps(verified_flags))

          report = {
            "selected_toolchain": tc,
            "rustc_vv": rustc_vv,
            "cargo_vv": cargo_vv,
            "package_name": pkg["name"],
            "package_version": pkg["version"],
            "edition": pkg["edition"],
            "targets": targets,
            "bevy_log_absent": log_chk.returncode != 0,
            "x11rb_absent": x11_chk.returncode != 0,
            "flag_probe": flag_probe,
            "verified_cfg_e_flags": verified_flags,
            "fmt_check": "PASS",
            "clippy_check": "PASS",
          }
          open("/tmp/ci-work/static_checks.json", "w").write(json.dumps(report, indent=2))
          msg = json.dumps(report).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::notice title=STATIC_CHECKS::{msg}")
          PY

      - name: Build untouched df47cac baseline & capture native-Wayland BEFORE evidence
        run: |
          set -euo pipefail
          TC="$(cat /tmp/ci-work/selected_tc.txt)"
          mkdir -p /tmp/ci-work/baseline-src /tmp/ci-work/baseline-stage
          git archive df47cacea44ac611f22f8d3598f63c4320b12071 | tar -x -C /tmp/ci-work/baseline-src

          /usr/bin/time -v -o /tmp/ci-work/time_baseline_j1.txt \
            cargo +"${TC}" build \
              --manifest-path /tmp/ci-work/baseline-src/Cargo.toml \
              --target-dir /tmp/ci-work/target-base-j1 \
              --locked --release --target x86_64-unknown-linux-gnu \
              --config 'build.jobs=1' \
              --config 'profile.release.opt-level=3' \
              --config 'profile.release.lto="thin"' \
              --config 'profile.release.codegen-units=1' \
              --config 'profile.release.panic="abort"' \
              --config 'profile.release.strip="symbols"' \
              --config 'profile.release.debug=0' \
              --config 'profile.release.debug-assertions=false' \
              --config 'profile.release.overflow-checks=false' \
              --config 'profile.release.incremental=false' \
              >/tmp/ci-work/build_base.log 2>&1

          cp /tmp/ci-work/target-base-j1/x86_64-unknown-linux-gnu/release/Subsystem-for-Arxumbra \
             /tmp/ci-work/baseline-stage/Subsystem-for-Arxumbra
          rm -rf /tmp/ci-work/target-base-j1

          python3 - << 'PY'
          import base64, json, os, subprocess, time
          from PIL import Image

          work = "/tmp/ci-work"
          ev = "/tmp/ci-work/evidence"
          rt_dir = "/tmp/ci-work/xdg-base"
          os.makedirs(rt_dir, exist_ok=True)
          os.chmod(rt_dir, 0o700)

          sway_cfg = os.path.join(work, "sway_base.cfg")
          with open(sway_cfg, "w") as f:
            f.write("xwayland disable\ndefault_border none\ndefault_floating_border none\noutput * bg #000000 solid_color\n")

          env = os.environ.copy()
          env.update({
            "XDG_RUNTIME_DIR": rt_dir,
            "WLR_BACKENDS": "headless",
            "WLR_LIBINPUT_NO_DEVICES": "1",
            "WLR_RENDERER": "pixman",
            "LIBGL_ALWAYS_SOFTWARE": "1",
          })
          env.pop("DISPLAY", None)

          sway = subprocess.Popen(["sway", "-c", sway_cfg], env=env, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          for _ in range(60):
            time.sleep(0.1)
            socks = [x for x in os.listdir(rt_dir) if x.startswith("wayland-") and not x.endswith(".lock")]
            swaysocks = [x for x in os.listdir(rt_dir) if x.startswith("sway-ipc.")]
            if socks and swaysocks:
                env["WAYLAND_DISPLAY"] = socks[0]
                env["SWAYSOCK"] = os.path.join(rt_dir, swaysocks[0])
                break

          subprocess.run(["swaymsg", "output", "HEADLESS-1", "resolution", "1920x1080", "scale", "1"], env=env, check=True)
          time.sleep(0.2)

          t0 = time.perf_counter()
          out_f = open(os.path.join(work, "base_stdout.bin"), "wb")
          err_f = open(os.path.join(work, "base_stderr.bin"), "wb")
          app = subprocess.Popen(
            ["/tmp/ci-work/baseline-stage/Subsystem-for-Arxumbra"],
            cwd="/tmp/ci-work/baseline-stage",
            env=env,
            stdout=out_f,
            stderr=err_f,
          )

          first_window_ms = None
          for _ in range(120):
            time.sleep(0.025)
            tree = subprocess.check_output(["swaymsg", "-t", "get_tree"], env=env, text=True)
            if "Subsystem-for-Arxumbra" in tree:
                first_window_ms = round((time.perf_counter() - t0) * 1000.0, 2)
                break

          time.sleep(1.2)
          subprocess.run(["grim", os.path.join(ev, "before_home.png")], env=env, check=True)

          img0 = Image.open(os.path.join(ev, "before_home.png")).convert("RGB")
          subprocess.run(["wtype", "-M", "ctrl", "-M", "shift", "-P", "d", "-s", "250", "-p", "d", "-m", "shift", "-m", "ctrl"], env=env, check=True)
          time.sleep(0.15)
          subprocess.run(["grim", os.path.join(ev, "before_after_ctrl_shift_d.png")], env=env, check=True)
          img1 = Image.open(os.path.join(ev, "before_after_ctrl_shift_d.png")).convert("RGB")
          ctrl_shift_diff_pixels = sum(1 for a, b in zip(img0.getdata(), img1.getdata()) if a != b)

          subprocess.run(["wtype", "-M", "ctrl", "-P", "a", "-s", "1750", "-p", "a", "-P", "w", "-s", "820", "-p", "w", "-m", "ctrl"], env=env, check=True)
          time.sleep(0.15)
          subprocess.run(["wtype", "-M", "ctrl", "-s", "40", "-k", "e", "-s", "40", "-m", "ctrl"], env=env, check=True)
          time.sleep(0.5)
          subprocess.run(["grim", os.path.join(ev, "before_registry.png")], env=env, check=True)

          b_home = Image.open(os.path.join(ev, "before_home.png")).convert("RGB")
          mid_sidebar_x = max(x for x in range(600) if b_home.getpixel((x, 540))[0] > 18)
          top_right_sidebar_rgb = b_home.getpixel((mid_sidebar_x, 0))
          bot_right_sidebar_rgb = b_home.getpixel((mid_sidebar_x, 1079))

          rss_kb = 0
          with open(f"/proc/{app.pid}/status") as sf:
            for line in sf:
                if line.startswith("VmRSS:"):
                    rss_kb = int(line.split()[1])

          app.terminate()
          try:
            app.wait(timeout=3)
          except Exception:
            app.kill()
          out_f.close()
          err_f.close()
          sway.terminate()

          txt = open("/tmp/ci-work/time_baseline_j1.txt").read()
          wall, max_rss = "", 0
          for ln in txt.splitlines():
            if "Elapsed (wall clock)" in ln:
                wall = ln.split(": ", 1)[1].strip()
            if "Maximum resident set size" in ln:
                max_rss = int(ln.split(": ", 1)[1].strip())

          base_report = {
            "provenance": "Untouched git commit df47cacea44ac611f22f8d3598f63c4320b12071 built on runner with original release.yml flags",
            "binary_size_bytes": os.path.getsize("/tmp/ci-work/baseline-stage/Subsystem-for-Arxumbra"),
            "compile_wall_j1": wall,
            "compile_peak_rss_mib": round(max_rss / 1024.0, 1),
            "wayland_first_window_ms": first_window_ms,
            "runtime_rss_mib": round(rss_kb / 1024.0, 2),
            "stdout_bytes": os.path.getsize(os.path.join(work, "base_stdout.bin")),
            "stderr_bytes": os.path.getsize(os.path.join(work, "base_stderr.bin")),
            "baseline_sidebar_right_edge_x": mid_sidebar_x,
            "baseline_top_right_corner_rgb": top_right_sidebar_rgb,
            "baseline_bot_right_corner_rgb": bot_right_sidebar_rgb,
            "baseline_ctrl_shift_d_moved_pixels": ctrl_shift_diff_pixels,
          }
          open("/tmp/ci-work/baseline_report.json", "w").write(json.dumps(base_report, indent=2))
          msg = json.dumps(base_report).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::notice title=BASELINE_DF47CAC::{msg}")

          for shot in ["before_home.png", "before_registry.png"]:
            im = Image.open(os.path.join(ev, shot))
            out_p = os.path.join(ev, "opt_" + shot)
            im.save(out_p, format="PNG", optimize=True, compress_level=9)
            b64 = base64.b64encode(open(out_p, "rb").read()).decode("ascii")
            if len(b64) < 58000:
                print(f"::notice title=IMG_{shot}::{b64}")
          PY

      - name: Run controlled compiler & linker flag experiments (V14 §6)
        run: |
          set -euo pipefail
          TC="$(cat /tmp/ci-work/selected_tc.txt)"
          CFG_E_FLAGS="$(cat /tmp/ci-work/verified_rustflags.json)"
          mkdir -p /tmp/ci-work/bins

          run_exp() {
            local NAME="$1"
            shift
            local TDIR="/tmp/ci-work/target-${NAME}"
            rm -rf "${TDIR}"
            /usr/bin/time -v -o "/tmp/ci-work/time_${NAME}.txt" \
              cargo +"${TC}" build --locked --release \
                --target x86_64-unknown-linux-gnu \
                --target-dir "${TDIR}" \
                "$@" >/tmp/ci-work/build_${NAME}.log 2>&1
            cp "${TDIR}/x86_64-unknown-linux-gnu/release/Subsystem-for-Arxumbra" "/tmp/ci-work/bins/${NAME}"
            rm -rf "${TDIR}"
          }

          run_exp "cfg_a_thin_o3_ovf_on_j4" \
            --config 'build.jobs=4' \
            --config 'profile.release.opt-level=3' \
            --config 'profile.release.lto="thin"' \
            --config 'profile.release.codegen-units=1' \
            --config 'profile.release.panic="abort"' \
            --config 'profile.release.strip="symbols"' \
            --config 'profile.release.debug=0' \
            --config 'profile.release.debug-assertions=false' \
            --config 'profile.release.overflow-checks=true' \
            --config 'profile.release.incremental=false'

          run_exp "cfg_b_thin_o3_ovf_off_j4" \
            --config 'build.jobs=4' \
            --config 'profile.release.opt-level=3' \
            --config 'profile.release.lto="thin"' \
            --config 'profile.release.codegen-units=1' \
            --config 'profile.release.panic="abort"' \
            --config 'profile.release.strip="symbols"' \
            --config 'profile.release.debug=0' \
            --config 'profile.release.debug-assertions=false' \
            --config 'profile.release.overflow-checks=false' \
            --config 'profile.release.incremental=false'

          run_exp "cfg_c_fat_o3_ovf_on_j4" \
            --config 'build.jobs=4' \
            --config 'profile.release.opt-level=3' \
            --config 'profile.release.lto="fat"' \
            --config 'profile.release.codegen-units=1' \
            --config 'profile.release.panic="abort"' \
            --config 'profile.release.strip="symbols"' \
            --config 'profile.release.debug=0' \
            --config 'profile.release.debug-assertions=false' \
            --config 'profile.release.overflow-checks=true' \
            --config 'profile.release.incremental=false'

          run_exp "cfg_d_fat_os_ovf_on_j4" \
            --config 'build.jobs=4' \
            --config 'profile.release.opt-level="s"' \
            --config 'profile.release.lto="fat"' \
            --config 'profile.release.codegen-units=1' \
            --config 'profile.release.panic="abort"' \
            --config 'profile.release.strip="symbols"' \
            --config 'profile.release.debug=0' \
            --config 'profile.release.debug-assertions=false' \
            --config 'profile.release.overflow-checks=true' \
            --config 'profile.release.incremental=false'

          /usr/bin/time -v -o "/tmp/ci-work/time_cfg_e_fat_o3_mir_gc.txt" \
            cargo +"${TC}" build --locked --release -v \
              --target x86_64-unknown-linux-gnu \
              --target-dir "/tmp/ci-work/target-cfg_e" \
              --config 'build.jobs=4' \
              --config 'profile.release.opt-level=3' \
              --config 'profile.release.lto="fat"' \
              --config 'profile.release.codegen-units=1' \
              --config 'profile.release.panic="abort"' \
              --config 'profile.release.strip="symbols"' \
              --config 'profile.release.debug=0' \
              --config 'profile.release.debug-assertions=false' \
              --config 'profile.release.overflow-checks=true' \
              --config 'profile.release.incremental=false' \
              --config "target.x86_64-unknown-linux-gnu.rustflags=${CFG_E_FLAGS}" \
              >/tmp/ci-work/build_cfg_e.log 2>&1
          cp "/tmp/ci-work/target-cfg_e/x86_64-unknown-linux-gnu/release/Subsystem-for-Arxumbra" "/tmp/ci-work/bins/cfg_e_fat_o3_mir_gc"
          rm -rf "/tmp/ci-work/target-cfg_e"

          python3 - << 'PY'
          import json, os, subprocess, time

          rt_dir = "/tmp/ci-work/xdg-bench"
          os.makedirs(rt_dir, exist_ok=True)
          os.chmod(rt_dir, 0o700)
          sway_cfg = "/tmp/ci-work/sway_bench.cfg"
          with open(sway_cfg, "w") as f:
            f.write("xwayland disable\ndefault_border none\noutput * bg #000000 solid_color\n")

          env = os.environ.copy()
          env.update({
            "XDG_RUNTIME_DIR": rt_dir,
            "WLR_BACKENDS": "headless",
            "WLR_LIBINPUT_NO_DEVICES": "1",
            "WLR_RENDERER": "pixman",
            "LIBGL_ALWAYS_SOFTWARE": "1",
          })
          env.pop("DISPLAY", None)
          sway = subprocess.Popen(["sway", "-c", sway_cfg], env=env, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          for _ in range(60):
            time.sleep(0.1)
            socks = [x for x in os.listdir(rt_dir) if x.startswith("wayland-") and not x.endswith(".lock")]
            swaysocks = [x for x in os.listdir(rt_dir) if x.startswith("sway-ipc.")]
            if socks and swaysocks:
                env["WAYLAND_DISPLAY"] = socks[0]
                env["SWAYSOCK"] = os.path.join(rt_dir, swaysocks[0])
                break
          subprocess.run(["swaymsg", "output", "HEADLESS-1", "resolution", "1920x1080", "scale", "1"], env=env, check=True)

          def parse_time(path):
            txt = open(path).read()
            wall, rss = "", 0
            for ln in txt.splitlines():
                if "Elapsed (wall clock)" in ln:
                    wall = ln.split(": ", 1)[1].strip()
                if "Maximum resident set size" in ln:
                    rss = int(ln.split(": ", 1)[1].strip())
            return wall, round(rss / 1024.0, 1)

          def bench_bin(bin_path):
            starts = []
            rss_mib = 0.0
            for _ in range(3):
                t0 = time.perf_counter()
                p = subprocess.Popen([bin_path], cwd="/tmp", env=env, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                for _ in range(120):
                    time.sleep(0.015)
                    tr = subprocess.check_output(["swaymsg", "-t", "get_tree"], env=env, text=True)
                    if "Subsystem-for-Arxumbra" in tr:
                        starts.append(round((time.perf_counter() - t0) * 1000.0, 2))
                        break
                time.sleep(0.25)
                with open(f"/proc/{p.pid}/status") as sf:
                    for line in sf:
                        if line.startswith("VmRSS:"):
                            rss_mib = round(int(line.split()[1]) / 1024.0, 2)
                p.terminate()
                p.wait(timeout=3)
                time.sleep(0.1)
            starts.sort()
            return starts[len(starts)//2] if starts else None, rss_mib

          results = []
          for name in [
            "cfg_a_thin_o3_ovf_on_j4",
            "cfg_b_thin_o3_ovf_off_j4",
            "cfg_c_fat_o3_ovf_on_j4",
            "cfg_d_fat_os_ovf_on_j4",
            "cfg_e_fat_o3_mir_gc",
          ]:
            bpath = f"/tmp/ci-work/bins/{name}"
            wall, peak_rss = parse_time(f"/tmp/ci-work/time_{name}.txt")
            med_start_ms, rt_rss = bench_bin(bpath)
            results.append({
                "config": name,
                "size_bytes": os.path.getsize(bpath),
                "compile_wall": wall,
                "compile_peak_rss_mib": peak_rss,
                "startup_median_ms": med_start_ms,
                "runtime_rss_mib": rt_rss,
            })

          sway.terminate()

          vlog = open("/tmp/ci-work/build_cfg_e.log").read()
          verified_flags = json.load(open("/tmp/ci-work/verified_rustflags.json"))
          probe_flag = verified_flags[0] if verified_flags else "-Csymbol-mangling-version=v0"
          dep_has_flag = ("--crate-name bevy_ecs " in vlog and probe_flag in vlog.split("--crate-name bevy_ecs ")[1].split("\n")[0])
          macro_clean = ("--crate-name bevy_ecs_macros " in vlog and probe_flag not in vlog.split("--crate-name bevy_ecs_macros ")[1].split("\n")[0])

          exp_summary = {
            "cfg_e_applied_flags": verified_flags,
            "scope_verified_bevy_ecs_has_target_flags": dep_has_flag,
            "scope_verified_proc_macro_clean": macro_clean,
            "experiments": results,
          }
          open("/tmp/ci-work/experiments.json", "w").write(json.dumps(exp_summary, indent=2))
          msg = json.dumps(exp_summary).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::notice title=COMPILER_EXPERIMENTS::{msg}")
          PY

      - name: Run full Native-Wayland V14 functional, geometry, motion, modal & Escape acceptance suite
        run: |
          set -euo pipefail
          mkdir -p /tmp/ci-work/isolated-run
          cp /tmp/ci-work/bins/cfg_e_fat_o3_mir_gc /tmp/ci-work/isolated-run/Subsystem-for-Arxumbra
          chmod 755 /tmp/ci-work/isolated-run/Subsystem-for-Arxumbra

          python3 - << 'PY'
          import json, os, subprocess, time
          from PIL import Image

          ev = "/tmp/ci-work/evidence"
          rt_dir = "/tmp/ci-work/xdg-accept"
          os.makedirs(rt_dir, exist_ok=True)
          os.chmod(rt_dir, 0o700)

          sway_cfg = "/tmp/ci-work/sway_accept.cfg"
          with open(sway_cfg, "w") as f:
            f.write("xwayland disable\ndefault_border none\ndefault_floating_border none\noutput * bg #000000 solid_color\n")

          env = os.environ.copy()
          env.update({
            "XDG_RUNTIME_DIR": rt_dir,
            "WLR_BACKENDS": "headless",
            "WLR_LIBINPUT_NO_DEVICES": "1",
            "WLR_RENDERER": "pixman",
            "LIBGL_ALWAYS_SOFTWARE": "1",
          })
          env.pop("DISPLAY", None)

          sway = subprocess.Popen(["sway", "-c", sway_cfg], env=env, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          for _ in range(60):
            time.sleep(0.1)
            socks = [x for x in os.listdir(rt_dir) if x.startswith("wayland-") and not x.endswith(".lock")]
            swaysocks = [x for x in os.listdir(rt_dir) if x.startswith("sway-ipc.")]
            if socks and swaysocks:
                env["WAYLAND_DISPLAY"] = socks[0]
                env["SWAYSOCK"] = os.path.join(rt_dir, swaysocks[0])
                break

          subprocess.run(["swaymsg", "output", "HEADLESS-1", "resolution", "1920x1080", "scale", "1"], env=env, check=True)
          time.sleep(0.2)

          out_path = "/tmp/ci-work/remaster_stdout.bin"
          err_path = "/tmp/ci-work/remaster_stderr.bin"
          out_f = open(out_path, "wb")
          err_f = open(err_path, "wb")

          app = subprocess.Popen(
            ["/tmp/ci-work/isolated-run/Subsystem-for-Arxumbra"],
            cwd="/tmp/ci-work/isolated-run",
            env=env,
            stdout=out_f,
            stderr=err_f,
          )

          def find_app_node(node):
            if node.get("app_id") == "Subsystem-for-Arxumbra" or "Subsystem-for-Arxumbra" in (node.get("name") or ""):
                return node
            for k in ("nodes", "floating_nodes"):
                for ch in node.get(k, []):
                    r = find_app_node(ch)
                    if r:
                        return r
            return None

          app_node = None
          for _ in range(120):
            time.sleep(0.05)
            tree = json.loads(subprocess.check_output(["swaymsg", "-t", "get_tree"], env=env, text=True))
            app_node = find_app_node(tree)
            if app_node:
                break

          time.sleep(0.45)

          def grab(name):
            p = os.path.join(ev, name)
            subprocess.run(["grim", p], env=env, check=True)
            return Image.open(p).convert("RGB")

          def find_dot_center(img):
            w, h = img.size
            px = img.load()
            for y in range(4, h - 4):
                for x in range(4, w - 4):
                    if (
                        px[x, y][0] >= 236
                        and px[x - 1, y][0] >= 230
                        and px[x + 1, y][0] >= 230
                        and px[x, y - 1][0] >= 230
                        and px[x, y + 1][0] >= 230
                    ):
                        ring_dark = sum(
                            1 for dx, dy in [(-4, 0), (4, 0), (0, -4), (0, 4), (-3, -3), (3, -3), (-3, 3), (3, 3)]
                            if px[x + dx, y + dy][0] <= 58
                        )
                        if ring_dark >= 7:
                            return (x, y)
            return None

          def move_dot_to(tx, ty):
            for _ in range(8):
                im = grab("_probe.png")
                cur = find_dot_center(im)
                if not cur:
                    break
                dx = tx - cur[0]
                dy = ty - cur[1]
                if abs(dx) <= 6 and abs(dy) <= 6:
                    return cur
                if abs(dx) > 4:
                    k = "d" if dx > 0 else "a"
                    ms = max(18, min(1400, int(abs(dx) / 0.50)))
                    subprocess.run(["wtype", "-M", "ctrl", "-P", k, "-s", str(ms), "-p", k, "-m", "ctrl"], env=env, check=True)
                    time.sleep(0.05)
                if abs(dy) > 4:
                    k = "s" if dy > 0 else "w"
                    ms = max(18, min(1400, int(abs(dy) / 0.50)))
                    subprocess.run(["wtype", "-M", "ctrl", "-P", k, "-s", str(ms), "-p", k, "-m", "ctrl"], env=env, check=True)
                    time.sleep(0.05)
            return find_dot_center(grab("_probe.png"))

          def ctrl_e():
            subprocess.run(["wtype", "-M", "ctrl", "-s", "35", "-k", "e", "-s", "35", "-m", "ctrl"], env=env, check=True)
            time.sleep(0.32)

          tests = {}

          tree = json.loads(subprocess.check_output(["swaymsg", "-t", "get_tree"], env=env, text=True))
          app_node = find_app_node(tree)
          tests["wayland_native_xdg_shell"] = (
            app_node is not None
            and app_node.get("shell") == "xdg_shell"
            and app_node.get("fullscreen_mode") == 1
            and app_node.get("rect", {}).get("width") == 1920
            and app_node.get("rect", {}).get("height") == 1080
            and app_node.get("deco_rect", {}).get("height", 0) == 0
          )
          tests["window_title"] = app_node.get("name") if app_node else None

          def cpu_ticks(pid):
            st = open(f"/proc/{pid}/stat").read().split(")")[1].split()
            return int(st[11]) + int(st[12])
          time.sleep(0.4)
          t_cpu0 = cpu_ticks(app.pid)
          time.sleep(2.0)
          t_cpu1 = cpu_ticks(app.pid)
          tests["settled_idle_2s_cpu_ticks_delta"] = t_cpu1 - t_cpu0
          tests["settled_idle_zero_spin"] = (t_cpu1 - t_cpu0) <= 2

          home_img = grab("after_home.png")
          init_dot = find_dot_center(home_img)
          tests["initial_dot_centered"] = (init_dot is not None and abs(init_dot[0] - 960) <= 2 and abs(init_dot[1] - 540) <= 2)

          sidebar_right_x = max(x for x in range(600) if home_img.getpixel((x, 540))[0] > 18)
          bg_rgb = home_img.getpixel((1500, 540))
          tl_rgb = home_img.getpixel((0, 0))
          bl_rgb = home_img.getpixel((0, 1079))
          tr_outer_rgb = home_img.getpixel((sidebar_right_x, 0))
          br_outer_rgb = home_img.getpixel((sidebar_right_x, 1079))
          tr_inner_rgb = home_img.getpixel((sidebar_right_x - 16, 16))
          tests["sidebar_width_px"] = sidebar_right_x + 1
          tests["sidebar_left_corners_flush"] = (tl_rgb[0] > bg_rgb[0] + 5 and bl_rgb[0] > bg_rgb[0] + 5)
          tests["sidebar_right_corners_rounded"] = (tr_outer_rgb == bg_rgb and br_outer_rgb == bg_rgb and tr_inner_rgb[0] > bg_rgb[0] + 5)

          for cmd in [
            ["wtype", "-P", "d", "-s", "150", "-p", "d"],
            ["wtype", "-k", "e"],
            ["wtype", "-k", "Tab"],
            ["wtype", "-k", "Return"],
            ["wtype", "-k", "space"],
            ["wtype", "-k", "Right"],
            ["wtype", "-M", "ctrl", "-M", "shift", "-P", "d", "-s", "180", "-p", "d", "-m", "shift", "-m", "ctrl"],
            ["wtype", "-M", "ctrl", "-M", "alt", "-P", "s", "-s", "180", "-p", "s", "-m", "alt", "-m", "ctrl"],
          ]:
            subprocess.run(cmd, env=env, check=True)
          subprocess.run(["swaymsg", "seat", "seat0", "cursor", "move", "190", "172"], env=env, check=True)
          subprocess.run(["swaymsg", "seat", "seat0", "cursor", "press", "button1"], env=env, check=True)
          subprocess.run(["swaymsg", "seat", "seat0", "cursor", "release", "button1"], env=env, check=True)
          time.sleep(0.15)
          after_forbidden = grab("_after_forbidden.png")
          tests["forbidden_inputs_ignored"] = (find_dot_center(after_forbidden) == init_dot and after_forbidden.getpixel((900, 60)) == bg_rgb)

          subprocess.run(["wtype", "-M", "ctrl", "-P", "a", "-P", "d", "-s", "220", "-p", "a", "-p", "d", "-m", "ctrl"], env=env, check=True)
          time.sleep(0.08)
          pos_opp = find_dot_center(grab("_opp.png"))
          tests["opposing_keys_cancel"] = (pos_opp == init_dot)

          hold_p = subprocess.Popen(["wtype", "-M", "ctrl", "-P", "d", "-s", "360", "-p", "d", "-m", "ctrl"], env=env)
          seq_x = []
          for _ in range(4):
            time.sleep(0.075)
            c = find_dot_center(grab("_seq.png"))
            if c:
                seq_x.append(c[0])
          hold_p.wait(timeout=3)
          time.sleep(0.04)
          stop_1 = find_dot_center(grab("_stop1.png"))
          time.sleep(0.18)
          stop_2 = find_dot_center(grab("_stop2.png"))
          tests["smooth_cardinal_positions"] = seq_x
          tests["smooth_monotonic_motion"] = (len(seq_x) >= 3 and all(seq_x[i] < seq_x[i+1] for i in range(len(seq_x)-1)))
          tests["immediate_stop_zero_drift"] = (stop_1 is not None and stop_1 == stop_2)

          diag_start = stop_2
          subprocess.run(["wtype", "-M", "ctrl", "-P", "w", "-P", "d", "-s", "260", "-p", "w", "-p", "d", "-m", "ctrl"], env=env, check=True)
          time.sleep(0.06)
          diag_end = find_dot_center(grab("_diag.png"))
          ddx = diag_end[0] - diag_start[0]
          ddy = diag_start[1] - diag_end[1]
          tests["diagonal_displacement"] = [ddx, ddy]
          tests["diagonal_normalized"] = (ddx > 40 and ddy > 40 and abs(ddx - ddy) <= 14)

          subprocess.run(["wtype", "-M", "ctrl", "-P", "d", "-P", "s", "-s", "1900", "-p", "d", "-p", "s", "-m", "ctrl"], env=env, check=True)
          time.sleep(0.08)
          clamp_br = find_dot_center(grab("_clamp_br.png"))
          tests["clamped_bottom_right_center"] = clamp_br
          tests["dot_fully_inside_viewport"] = (clamp_br is not None and 1912 <= clamp_br[0] <= 1916 and 1072 <= clamp_br[1] <= 1076)

          move_dot_to(190, 172)
          subprocess.run(["wtype", "-P", "e", "-s", "90", "-M", "ctrl", "-s", "90", "-p", "e", "-m", "ctrl"], env=env, check=True)
          time.sleep(0.3)
          preheld_img = grab("_preheld_e.png")
          tests["preheld_e_then_ctrl_rejected"] = (preheld_img.getpixel((900, 60)) == bg_rgb)

          ctrl_e()
          reg_img = grab("after_registry.png")
          tests["registry_panel_visible"] = (reg_img.getpixel((600, 60))[0] > bg_rgb[0] + 3)

          subprocess.run(["wtype", "-k", "F1"], env=env, check=True)
          time.sleep(0.32)
          reg_hidden_img = grab("after_registry_menu_hidden.png")
          reg_panel_left_vis = min(x for x in range(350, 500) if reg_img.getpixel((x, 540))[0] > bg_rgb[0] + 10)
          reg_panel_left_hid = min(x for x in range(350, 500) if reg_hidden_img.getpixel((x, 540))[0] > bg_rgb[0] + 10)
          tests["f1_hides_left_menu_keeps_right_panel_fixed"] = (
            reg_hidden_img.getpixel((100, 540)) == bg_rgb
            and reg_panel_left_vis == reg_panel_left_hid
          )
          move_dot_to(190, 116)
          ctrl_e()
          still_reg_img = grab("_still_reg.png")
          tests["hidden_menu_controls_non_interactive"] = (still_reg_img.getpixel((600, 60))[0] > bg_rgb[0] + 3)

          subprocess.run(["wtype", "-k", "F1"], env=env, check=True)
          time.sleep(0.32)

          sw_px = sidebar_right_x + 1
          launch_cx = int(sw_px + 16 + 28 + 480 - 18 - 74)
          launch_cy = 235
          move_dot_to(launch_cx, launch_cy)
          grab("after_registry_launch_hover.png")
          ctrl_e()
          ws_img = grab("after_workspace.png")
          panel_bg = ws_img.getpixel((1100, 540))
          tests["workspace_entered_card_removed"] = (ws_img.getpixel((launch_cx - 200, 235)) == panel_bg)
          tests["workspace_create_project_row_present"] = (ws_img.getpixel((200, 116))[0] > ws_img.getpixel((200, 300))[0] + 5)
          tests["workspace_second_nav_row_removed"] = (ws_img.getpixel((200, 172)) == ws_img.getpixel((200, 300)))

          move_dot_to(190, 116)
          ctrl_e()
          modal_clean = grab("after_workspace_modal_clean.png")
          modal_interior_rgb = modal_clean.getpixel((960, 540))
          interior_colors = {modal_clean.getpixel((x, y)) for x in range(800, 1120, 8) for y in range(440, 640, 8)}
          tests["modal_centered_and_completely_empty"] = (len(interior_colors) == 1 and modal_interior_rgb[0] > 18)

          move_dot_to(960, 540)
          modal_dot_inside = grab("after_modal_dot_above.png")
          tests["dot_renders_above_modal"] = (find_dot_center(modal_dot_inside) is not None)
          ctrl_e()
          after_inside_click = grab("_modal_inside_click.png")
          tests["ctrl_e_inside_modal_keeps_modal_open"] = (after_inside_click.getpixel((820, 540)) == modal_interior_rgb)

          subprocess.run(["wtype", "-k", "F1"], env=env, check=True)
          time.sleep(0.32)
          modal_f1_img = grab("after_modal_menu_hidden.png")
          tests["f1_with_modal_keeps_modal_open"] = (modal_f1_img.getpixel((820, 540)) == modal_interior_rgb)
          subprocess.run(["wtype", "-k", "F1"], env=env, check=True)
          time.sleep(0.32)

          move_dot_to(190, 116)
          ctrl_e()
          dismissed_img = grab("_modal_dismissed.png")
          tests["backdrop_ctrl_e_dismisses_without_click_through"] = (dismissed_img.getpixel((960, 540)) == panel_bg)

          rss_before_cycles = int([l for l in open(f"/proc/{app.pid}/status") if l.startswith("VmRSS:")][0].split()[1])
          for _ in range(5):
            ctrl_e()
            ctrl_e()
          rss_after_cycles = int([l for l in open(f"/proc/{app.pid}/status") if l.startswith("VmRSS:")][0].split()[1])
          tests["modal_5_cycles_rss_delta_kb"] = rss_after_cycles - rss_before_cycles

          ctrl_e()

          subprocess.run(["wtype", "-P", "Escape", "-s", "2200", "-p", "Escape"], env=env, check=True)
          time.sleep(0.2)
          short_esc_img = grab("_short_esc.png")
          tests["short_escape_cancelled_no_action"] = (short_esc_img.getpixel((820, 540)) == modal_interior_rgb)

          esc_bg = subprocess.Popen(["wtype", "-P", "Escape", "-s", "5600", "-p", "Escape"], env=env)
          time.sleep(1.5)
          subprocess.run(["swaymsg", "workspace", "2"], env=env, check=True)
          time.sleep(1.0)
          subprocess.run(["swaymsg", "workspace", "1"], env=env, check=True)
          esc_bg.wait(timeout=6)
          time.sleep(0.25)
          unfocus_esc_img = grab("_unfocus_esc.png")
          tests["focus_loss_cancels_escape_hold_and_suppresses_stale"] = (unfocus_esc_img.getpixel((820, 540)) == modal_interior_rgb)

          esc_long = subprocess.Popen(["wtype", "-P", "Escape", "-s", "8500", "-p", "Escape"], env=env)
          time.sleep(2.5)
          mid_hold_img = grab("_mid_5s_hold.png")
          mid_diff = sum(1 for a, b in zip(unfocus_esc_img.getdata(), mid_hold_img.getdata()) if a != b)
          tests["escape_hold_zero_visual_indicator_diff_px"] = mid_diff

          time.sleep(3.2)
          at_5_7s_img = grab("_at_5_7s.png")
          returned_at_5s = (at_5_7s_img.getpixel((820, 540)) != modal_interior_rgb and at_5_7s_img.getpixel((launch_cx - 200, 200))[0] != panel_bg[0])

          time.sleep(2.5)
          still_alive_at_8_2s = (app.poll() is None)
          esc_long.wait(timeout=3)
          time.sleep(0.25)
          tests["workspace_5s_escape_returns_to_registry_closes_modal"] = returned_at_5s
          tests["workspace_escape_held_past_8s_never_exits"] = (still_alive_at_8_2s and app.poll() is None)

          subprocess.run(["swaymsg", "output", "HEADLESS-1", "scale", "2"], env=env, check=True)
          time.sleep(0.4)
          hidpi_img = grab("after_hidpi_scale2.png")
          tests["hidpi_scale2_renders_cleanly"] = (hidpi_img.size == (1920, 1080) and hidpi_img.getpixel((0, 0))[0] > bg_rgb[0] + 5)
          subprocess.run(["swaymsg", "output", "HEADLESS-1", "scale", "1"], env=env, check=True)
          time.sleep(0.3)

          subprocess.run(["wtype", "-k", "F1"], env=env, check=True)
          time.sleep(0.2)
          exit_hold = subprocess.Popen(["wtype", "-P", "Escape", "-s", "7600", "-p", "Escape"], env=env)
          exit_code = app.wait(timeout=10)
          exit_hold.wait(timeout=3)
          out_f.close()
          err_f.close()
          sway.terminate()

          tests["registry_7s_escape_clean_exit_code"] = exit_code
          tests["external_stdout_bytes"] = os.path.getsize(out_path)
          tests["external_stderr_bytes"] = os.path.getsize(err_path)
          tests["silent_stdout_stderr"] = (os.path.getsize(out_path) == 0 and os.path.getsize(err_path) == 0)

          open("/tmp/ci-work/wayland_tests.json", "w").write(json.dumps(tests, indent=2))
          msg = json.dumps(tests).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::notice title=WAYLAND_ACCEPTANCE::{msg}")
          PY

      - name: Emit rendered AFTER native-Wayland screenshots & summary
        run: |
          python3 - << 'PY'
          import base64, os
          from PIL import Image

          ev = "/tmp/ci-work/evidence"
          shots = [
            "after_home.png",
            "after_registry.png",
            "after_registry_menu_hidden.png",
            "after_workspace.png",
            "after_workspace_modal_clean.png",
            "after_modal_dot_above.png",
          ]
          for shot in shots:
            p = os.path.join(ev, shot)
            if os.path.exists(p):
                im = Image.open(p)
                op = os.path.join(ev, "opt_" + shot)
                im.save(op, format="PNG", optimize=True, compress_level=9)
                b64 = base64.b64encode(open(op, "rb").read()).decode("ascii")
                if len(b64) < 60000:
                    print(f"::notice title=IMG_{shot}::{b64}")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "w") as sf:
            sf.write("## Static Checks\n```json\n" + open("/tmp/ci-work/static_checks.json").read() + "\n```\n")
            sf.write("## Baseline df47cac\n```json\n" + open("/tmp/ci-work/baseline_report.json").read() + "\n```\n")
            sf.write("## Controlled Compiler Experiments\n```json\n" + open("/tmp/ci-work/experiments.json").read() + "\n```\n")
            sf.write("## Native Wayland Acceptance Matrix\n```json\n" + open("/tmp/ci-work/wayland_tests.json").read() + "\n```\n")
          PY
          test -z "$(git status --porcelain)"

      - name: Upload bounded diagnostic evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: v14-wayland-and-compiler-evidence
          path: |
            /tmp/ci-work/*.json
            /tmp/ci-work/evidence/opt_*.png
          if-no-files-found: error
          retention-days: 5
