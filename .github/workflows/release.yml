            --config 'profile.release.overflow-checks=true'
      - name: Stage 3
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/stage"
          cp "${RUNNER_TEMP}/target/aarch64-pc-windows-msvc/release/Subsystem-for-Arxumbra.exe" "${RUNNER_TEMP}/stage/AArch64-Windows-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1.exe"
      - name: Stage 4
        shell: pwsh
        run: |
          Compress-Archive -Path "${env:RUNNER_TEMP}\stage\AArch64-Windows-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1.exe" -DestinationPath "${env:RUNNER_TEMP}\AArch64-Windows-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1.zip"
