  config_audit:
    name: Configuration Audit (temporary)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Stage 0
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Stage 1
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev
      - name: Stage 2
        shell: bash
        run: |
          PYBIN="$(command -v python3 || command -v python)"
          "$PYBIN" - << 'PY'
          import hashlib, json, os, re, subprocess, sys, time
          def esc(m):
              return str(m).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")[:3800]
          def notice(title, msg):
              print("::notice title=" + title + "::" + esc(msg), flush=True)
          def sh(cmd):
              p = subprocess.run(cmd, shell=True, capture_output=True, text=True)
              return p.returncode, p.stdout, p.stderr
          def chk(rc, stage, detail):
              if rc != 0:
                  notice("AUD_FAIL_" + stage, " ".join(str(detail).split())[-2200:])
                  raise SystemExit(1)
          NT = "nightly-2026-10-25"
          rc, so, se = sh("rustup toolchain install " + NT + " --profile minimal")
          chk(rc, "TOOLCHAIN", se)
          rc, so, se = sh("rustup target add x86_64-unknown-linux-gnu --toolchain " + NT)
          chk(rc, "TARGET", se)
          rc, rv, _ = sh("rustc +" + NT + " -Vv")
          rc2, cv, _ = sh("cargo +" + NT + " -V")
          notice("AUD_TOOLCHAIN", json.dumps({"rustc": rv.splitlines()[:2], "cargo": cv.strip()}))
          rc, so, se = sh("rustup toolchain install nightly-2026-10-26 --profile minimal")
          probe = {"published": rc == 0}
          if rc != 0:
              probe["stderr_tail"] = " ".join(se.split())[-180:]
          else:
              sh("rustup toolchain uninstall nightly-2026-10-26")
          notice("AUD_NIGHTLY26_PROBE", json.dumps(probe))
          rc, so, se = sh("cargo +" + NT + " fetch --locked")
          chk(rc, "FETCH", se)
          rc, so, se = sh("cargo +" + NT + " metadata --no-deps --format-version 1")
          chk(rc, "METADATA", se)
          pk = json.loads(so)["packages"][0]
          tg = [(t["name"], t["kind"]) for t in pk["targets"]]
          if tg != [("Subsystem-for-Arxumbra", ["bin"])]:
              notice("AUD_FAIL_TARGETS", json.dumps(tg))
              raise SystemExit(1)
          notice("AUD_METADATA", json.dumps({"package": pk["name"], "version": pk["version"], "targets": tg}))
          lock = open("Cargo.lock", "rb").read()
          notice("AUD_LOCK", json.dumps({"sha256": hashlib.sha256(lock).hexdigest(), "lock_version": re.search(rb"version = (\d+)", lock).group(1).decode()}))
          rc, so, se = sh("cargo +" + NT + " tree -e no-dev --target x86_64-unknown-linux-gnu")
          chk(rc, "TREE", se)
          names = set()
          for ln in so.splitlines():
              m = re.search(r"([A-Za-z0-9_\-\.]+) v\d+\.\d+", ln)
              if m:
                  names.add(m.group(1))
          watch = sorted(n for n in names if n in ("bevy_log", "tracing", "tracing-core", "tracing-subscriber", "log", "env_logger"))
          rc, ti, te = sh("cargo +" + NT + " tree -i tracing -e no-dev --target x86_64-unknown-linux-gnu")
          notice("AUD_FEATURE_GRAPH", json.dumps({"graph_packages": len(names), "logging_watchlist": watch,
              "tracing_reverse_first8": (ti.splitlines()[:8] if rc == 0 else ["absent: " + " ".join(te.split())[-140:]]),
              "total_graph_lines": len(so.splitlines())}))
          rc, bi, be = sh("cargo +" + NT + " tree -i bevy_log -e no-dev --target x86_64-unknown-linux-gnu")
          notice("AUD_BEVYLOG_REV", json.dumps({"present": rc == 0,
              "first8": (bi.splitlines()[:8] if rc == 0 else ["absent: " + " ".join(be.split())[-140:]])}))
          cfgs = ["build.incremental=false", "profile.release.opt-level=3", "profile.release.lto=\"fat\"", "profile.release.codegen-units=1", "profile.release.panic=\"abort\"", "profile.release.strip=\"symbols\"", "profile.release.debug=false", "profile.release.overflow-checks=true"]
          cmd = ("cargo +" + NT + " build -v --release --locked --bin Subsystem-for-Arxumbra --target x86_64-unknown-linux-gnu"
                 + " --target-dir " + os.environ["RUNNER_TEMP"] + "/audit-target "
                 + " ".join("--config '" + c + "'" for c in cfgs))
          t0 = time.time()
          p = subprocess.run(cmd, shell=True, capture_output=True, text=True)
          dt = round(time.time() - t0, 1)
          combined = p.stdout + "\n" + p.stderr
          chk(p.returncode, "BUILD", combined)
          inv = [ln for ln in combined.splitlines() if "Running `" in ln and "subsystem_for_arxumbra" in ln.lower()]
          if not inv:
              runl = [ln for ln in combined.splitlines() if "Running `" in ln]
              notice("AUD_FAIL_INV", json.dumps({"running_line_count": len(runl), "samples": [l.strip()[:260] for l in runl[:2]]}))
              raise SystemExit(1)
          last = inv[-1]
          missing = [f for f in ("opt-level=3", "codegen-units=1", "panic=abort", "strip=symbols") if f not in last]
          if missing:
              notice("AUD_FAIL_FLAGS", json.dumps({"missing": missing, "invocation": last[:2200]}))
              raise SystemExit(1)
          flags = re.findall(r"-C\s+\S+", last)
          exe = os.environ["RUNNER_TEMP"] + "/audit-target/x86_64-unknown-linux-gnu/release/Subsystem-for-Arxumbra"
          size = os.path.getsize(exe)
          notice("AUD_EFF_FLAGS", json.dumps({"build_s": dt, "exe_bytes": size, "matches_certified_shipping_bytes": size == 35822504, "crate_rustc_flags": flags[:28]}))
          print("config audit complete")
          PY
