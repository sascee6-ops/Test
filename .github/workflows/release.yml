  aarch64_linux:
    name: AArch64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    steps:
      - name: Stage 0
        shell: bash
        run: |
          git init .
          git remote add origin https://github.com/sascee6-ops/Test.git
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Stage 1
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev
      - name: Stage 2
        shell: bash
        run: |
          rustup toolchain install nightly-2026-10-25 --profile minimal
          rustup target add aarch64-unknown-linux-gnu --toolchain nightly-2026-10-25
      - name: Stage 3
        shell: bash
        run: |
          cargo +nightly-2026-10-25 build --quiet --release --locked \
            --bin Subsystem-for-Arxumbra \
            --target aarch64-unknown-linux-gnu \
            --target-dir "${RUNNER_TEMP}/target" \
            --config 'build.incremental=false' \
            --config 'profile.release.opt-level=3' \
            --config 'profile.release.lto="fat"' \
            --config 'profile.release.codegen-units=1' \
            --config 'profile.release.panic="abort"' \
            --config 'profile.release.strip="symbols"' \
            --config 'profile.release.debug=false' \
            --config 'profile.release.overflow-checks=true'
      - name: Stage 4
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/stage"
          install -m 644 "${RUNNER_TEMP}/target/aarch64-unknown-linux-gnu/release/Subsystem-for-Arxumbra" "${RUNNER_TEMP}/stage/AArch64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1"
      - name: Stage 5
        shell: bash
        run: |
          cd "${RUNNER_TEMP}/stage"
          7z a "${RUNNER_TEMP}/AArch64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1.7z" "AArch64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1"
      - name: Stage 6
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AArch64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1
          path: ${{ runner.temp }}/AArch64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1.7z
          retention-days: 7
          if-no-files-found: error
