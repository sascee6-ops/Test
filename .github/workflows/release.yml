      - name: Stage 4
        shell: bash
        run: |
          tar -C "${RUNNER_TEMP}/stage" -czf "${RUNNER_TEMP}/AArch64-macOS-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1.tar.gz" AArch64-macOS-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1
      - name: Stage 5
