      - name: Static gates rustfmt & clippy with diff evidence
        run: |
          python3 - << 'PY'
          import subprocess
          fmt = subprocess.run(["cargo", "+nightly-2026-10-24", "fmt", "--all", "--", "--check"], capture_output=True, text=True)
          clip = subprocess.run(["cargo", "+nightly-2026-10-24", "clippy", "--quiet", "--message-format=short", "--locked", "--target", "x86_64-unknown-linux-gnu", "--", "-D", "warnings"], capture_output=True, text=True)
          diff_txt = ("RUSTFMT_DIFF:\n" + fmt.stdout + fmt.stderr + "\nCLIPPY_DIFF:\n" + clip.stdout + clip.stderr)[:3800]
          if fmt.stdout.strip() or fmt.stderr.strip() or clip.stdout.strip() or clip.stderr.strip() or fmt.returncode or clip.returncode:
            print("::notice title=STATIC_GATE_DIFF::" + diff_txt.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          raise SystemExit(0)
          PY
