  archive_verification:
    name: Archive Verification (temporary)
    needs: [aarch64_linux, x86_64_linux, aarch64_macos, x86_64_macos, aarch64_windows, x86_64_windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Stage 0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: ${{ runner.temp }}/artifacts
      - name: Stage 1
        shell: bash
        run: |
          PYBIN="$(command -v python3 || command -v python)"
          "$PYBIN" - << 'PY'
          import hashlib, json, os, shutil, struct, subprocess, sys
          def esc(m):
              return str(m).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")[:3800]
          def notice(title, msg):
              print("::notice title=" + title + "::" + esc(msg), flush=True)
          root = os.environ["RUNNER_TEMP"] + "/artifacts"
          EXPECT = [
              ("AArch64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1", "", "elf", 0xB7, True),
              ("x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1", "", "elf", 0x3E, True),
              ("AArch64-macOS-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1", "", "macho", 0x100000C, True),
              ("x86_64-macOS-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1", "", "macho", 0x1000007, True),
              ("AArch64-Windows-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1", ".exe", "pe", 0xAA64, False),
              ("x86_64-Windows-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1", ".exe", "pe", 0x8664, False),
          ]
          def entries_of(arc):
              lst = subprocess.run(["7z", "l", "-slt", arc], capture_output=True, text=True)
              assert lst.returncode == 0, lst.stderr[-300:]
              txt = lst.stdout.split("----------")[-1]
              out = []
              for b in txt.split("\n\n"):
                  if "Path = " in b:
                      out.append(dict(l.split(" = ", 1) for l in b.splitlines() if " = " in l))
              return out
          def arch_of(full, kind, aval):
              if kind == "elf":
                  assert full[:4] == b"\x7fELF", full[:8].hex()
                  machine = struct.unpack_from("<H", full, 18)[0]
                  assert machine == aval, hex(machine)
                  return "ELF e_machine " + hex(machine)
              if kind == "macho":
                  magic = struct.unpack_from("<I", full, 0)[0]
                  assert magic in (0xFEEDFACF, 0xCFFAEDFE), hex(magic)
                  cputype = struct.unpack_from("<I", full, 4)[0]
                  assert cputype == aval, hex(cputype)
                  return "Mach-O cputype " + hex(cputype)
              assert full[:2] == b"MZ", full[:2].hex()
              off = struct.unpack_from("<I", full, 0x3C)[0]
              assert full[off:off + 4] == b"PE\x00\x00", full[off:off + 4].hex()
              machine = struct.unpack_from("<H", full, off + 4)[0]
              assert machine == aval, hex(machine)
              return "PE machine " + hex(machine)
          def verify(job, ext, kind, aval, unix):
              d = os.path.join(root, job)
              got_files = sorted(os.listdir(d))
              assert got_files == [job + ".7z"], got_files
              arc = os.path.join(d, job + ".7z")
              exe = job + ext
              es = entries_of(arc)
              assert len(es) == 1, es
              e0 = es[0]
              assert e0["Path"] == exe and "/" not in e0["Path"], e0
              assert int(e0["Size"]) > 0, e0
              attrs = e0.get("Attributes", "")
              if unix:
                  assert "x" not in attrs, "execute bit stored in archive: " + attrs
              vd = os.path.join(root, "extract_" + job.split("-Subsystem")[0])
              shutil.rmtree(vd, ignore_errors=True)
              os.makedirs(vd)
              ex = subprocess.run(["7z", "x", "-y", "-o" + vd, arc], capture_output=True, text=True)
              assert ex.returncode == 0, ex.stderr[-300:]
              got = sorted(os.listdir(vd))
              assert got == [exe], got
              assert not [e for e in got if os.path.isdir(os.path.join(vd, e))], got
              fx = os.path.join(vd, exe)
              full = open(fx, "rb").read()
              arch = arch_of(full, kind, aval)
              mode = os.stat(fx).st_mode & 0o777
              assert not os.access(fx, os.X_OK), "file is executable after extraction (mode " + oct(mode) + ")"
              if unix:
                  assert mode == 0o644, oct(mode)
              return {"archive": job + ".7z", "archive_bytes": os.path.getsize(arc),
                      "sha256": hashlib.sha256(open(arc, "rb").read()).hexdigest(),
                      "entries": [[e0["Path"], e0["Size"], attrs]], "extracted": got,
                      "arch": arch, "mode": oct(mode), "exec_ok": False, "exe_bytes": len(full)}
          fails = []
          results = {}
          for job, ext, kind, aval, unix in EXPECT:
              short = job.split("-Subsystem")[0].replace("-", "_")
              try:
                  res = verify(job, ext, kind, aval, unix)
                  results[short] = res
                  notice("PKG245_" + short, json.dumps(res))
              except AssertionError as e:
                  fails.append((short, repr(e)))
                  notice("PKG245_FAIL_" + short, repr(e))
          notice("PKG245_SUMMARY", json.dumps({"verified": sorted(results), "failed": [f[0] for f in fails],
              "exec_ok_all_false": all(not v["exec_ok"] for v in results.values()),
              "exe_bytes": {k: v["exe_bytes"] for k, v in results.items()}}))
          assert not fails, fails
          print("archive verification complete")
          PY
