      - name: Stage 2
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_mode != 'debug') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        shell: bash
        run: |
          cargo +nightly-2026-10-25 build --quiet --locked \
            --release \
            --bin Subsystem-for-Arxumbra \
            --target aarch64-apple-darwin \
            --target-dir "${RUNNER_TEMP}/target" \
            --config 'build.incremental=false' \
            --config 'profile.release.opt-level=3' \
            --config 'profile.release.lto="fat"' \
            --config 'profile.release.codegen-units=1' \
            --config 'profile.release.panic="abort"' \
            --config 'profile.release.strip="symbols"' \
            --config 'profile.release.debug=false' \
            --config 'profile.release.overflow-checks=true'
      - name: Stage 3
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_mode != 'debug') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/stage"
          install -m 755 "${RUNNER_TEMP}/target/aarch64-apple-darwin/release/Subsystem-for-Arxumbra" "${RUNNER_TEMP}/stage/AArch64-macOS-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1"
      - name: Stage 4
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_mode != 'debug') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        shell: bash
        run: |
          tar -czf "${RUNNER_TEMP}/AArch64-macOS-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1.tar.gz" -C "${RUNNER_TEMP}/stage" "AArch64-macOS-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1"
      - name: Stage 5
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_mode != 'debug') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: AArch64-macOS-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1
          path: ${{ runner.temp }}/AArch64-macOS-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1.tar.gz
          retention-days: 7
          if-no-files-found: error
  x86_64_macos:
    name: x86_64-macOS-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1
    runs-on: macos-15-intel
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_mode != 'debug') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    timeout-minutes: 75
    steps:
      - name: Stage 0
        shell: bash
        run: |
          git init .
          git remote add origin https://github.com/sascee6-ops/Test.git
