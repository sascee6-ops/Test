name: release

on:
  push:
    branches:
      - arena/2494d094-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aarch64_linux:
    name: AArch64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    steps:
      - name: Stage 0
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Stage 1
        shell: bash
        run: |
          set -e
          sudo apt-get update -qq > /dev/null 2>&1
          sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev > /dev/null 2>&1
      - name: Stage 2
        shell: bash
        run: |
          set -e
          CIW="${RUNNER_TEMP}/ci-work"
          mkdir -p "${CIW}/dist" "${CIW}/stage"
          set +e
          rustup toolchain install nightly-2026-10-25 --profile minimal --component rustc --component cargo --component rust-std > "${CIW}/rustup.log" 2>&1
          RC=$?
          rustup target add aarch64-unknown-linux-gnu --toolchain nightly-2026-10-25 >> "${CIW}/rustup.log" 2>&1
          RC2=$?
          set -e
          if [ "${RC}" -ne 0 ] || [ "${RC2}" -ne 0 ]; then
            PYBIN="$(command -v python3 || command -v python)"
            "$PYBIN" - "${CIW}/rustup.log" << 'PY'
          import sys
          t = open(sys.argv[1], errors="replace").read()[-3500:].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::notice title=TOOLCHAIN_ERR::" + t)
          PY
            exit 1
          fi
      - name: Stage 3
        shell: bash
        run: |
          set -e
          CIW="${RUNNER_TEMP}/ci-work"
          set +e
          cargo +nightly-2026-10-25 build \
            --bin Subsystem-for-Arxumbra \
            --target aarch64-unknown-linux-gnu \
            --release \
            --locked \
            --target-dir "${CIW}/ctarget" \
            --config 'build.incremental=false' \
            --config 'profile.release.opt-level=3' \
            --config 'profile.release.lto="fat"' \
            --config 'profile.release.codegen-units=1' \
            --config 'profile.release.panic="abort"' \
            --config 'profile.release.strip="symbols"' \
            --config 'profile.release.debug=false' \
            --config 'profile.release.overflow-checks=true' \
            > "${CIW}/build.log" 2>&1
          BC=$?
          set -e
          if [ "${BC}" -ne 0 ]; then
            PYBIN="$(command -v python3 || command -v python)"
            "$PYBIN" - "${CIW}/build.log" << 'PY'
          import sys
          t = open(sys.argv[1], errors="replace").read()[-3500:].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::notice title=BUILD_ERR::" + t)
          PY
            exit "${BC}"
          fi
      - name: Stage 4
        shell: bash
        run: |
          set -e
          CIW="${RUNNER_TEMP}/ci-work"
          if ! cp "${CIW}/ctarget/aarch64-unknown-linux-gnu/release/Subsystem-for-Arxumbra" "${CIW}/stage/AArch64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1"; then
            PYBIN="$(command -v python3 || command -v python)"
            "$PYBIN" - "${CIW}/ctarget" << 'PY'
          import os, sys
          root = sys.argv[1]
          hits = []
          for dp, dn, fn in os.walk(root):
              for f in fn:
                  if "Subsystem" in f:
                      hits.append(os.path.join(dp, f))
              if len(hits) > 12:
                  break
          print("::notice title=STAGE_FAIL::" + str(hits[:12]).replace("%", "%25")[:3500])
          PY
            exit 1
          fi
          chmod 755 "${CIW}/stage/AArch64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1"
      - name: Stage 5
        shell: bash
        run: |
          set -e
          CIW="${RUNNER_TEMP}/ci-work"
          PYBIN="$(command -v python3 || command -v python)"
          "$PYBIN" - "AArch64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1" "" "tar.gz" "$CIW" "elf" "0xB7" "PKG_VERIFY" << 'PY'
          import hashlib, json, os, shutil, struct, sys, tarfile, zipfile
          def esc(m):
              return str(m).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")[:3800]
          job, ext, aext, ciw, kind, aval_s, title = sys.argv[1:8]
          aval = int(aval_s, 0)
          stage = os.path.join(ciw, "stage")
          dist = os.path.join(ciw, "dist")
          exe = job + ext
          arc = os.path.join(dist, job + "." + aext)
          src = os.path.join(stage, exe)
          def verify():
              assert os.path.isfile(src), "staged executable missing: " + src
              assert os.path.getsize(src) > 0, "staged executable empty"
              if aext == "tar.gz":
                  with tarfile.open(arc, "w:gz") as t:
                      t.add(src, arcname=exe)
              else:
                  with zipfile.ZipFile(arc, "w", zipfile.ZIP_DEFLATED) as z:
                      z.write(src, arcname=exe)
              if aext == "tar.gz":
                  with tarfile.open(arc) as t:
                      ms = t.getmembers()
                      entries = [[m.name, m.isreg(), m.size, oct(m.mode & 0o777)] for m in ms]
                      assert len(ms) == 1, entries
                      m0 = ms[0]
                      assert m0.name == exe and m0.isreg() and m0.size > 0 and "/" not in m0.name, entries
                      assert m0.mode & 0o111, entries
              else:
                  with zipfile.ZipFile(arc) as z:
                      zs = z.infolist()
                      entries = [[i.filename, not i.is_dir(), i.file_size, oct((i.external_attr >> 16) & 0o777)] for i in zs]
                      assert len(zs) == 1, entries
                      i0 = zs[0]
                      assert i0.filename == exe and not i0.is_dir() and i0.file_size > 0 and "/" not in i0.filename, entries
              vd = os.path.join(ciw, "verify")
              shutil.rmtree(vd, ignore_errors=True)
              os.makedirs(vd)
              if aext == "tar.gz":
                  with tarfile.open(arc) as t:
                      try:
                          t.extractall(vd, filter="data")
                      except TypeError:
                          t.extractall(vd)
              else:
                  with zipfile.ZipFile(arc) as z:
                      z.extractall(vd)
              got = sorted(os.listdir(vd))
              assert got == [exe], got
              fx = os.path.join(vd, exe)
              assert os.path.isfile(fx), got
              assert not [e for e in got if os.path.isdir(os.path.join(vd, e))], got
              full = open(fx, "rb").read()
              assert len(full) > 0, "extracted file empty"
              if kind == "elf":
                  assert full[:4] == b"\x7fELF", full[:8].hex()
                  machine = struct.unpack_from("<H", full, 18)[0]
                  assert machine == aval, hex(machine)
                  arch = "ELF e_machine " + hex(machine)
              elif kind == "macho":
                  magic = struct.unpack_from("<I", full, 0)[0]
                  assert magic in (0xFEEDFACF, 0xCFFAEDFE), hex(magic)
                  cputype = struct.unpack_from("<I", full, 4)[0]
                  assert cputype == aval, hex(cputype)
                  arch = "Mach-O cputype " + hex(cputype)
              else:
                  assert full[:2] == b"MZ", full[:2].hex()
                  off = struct.unpack_from("<I", full, 0x3C)[0]
                  assert full[off:off + 4] == b"PE\x00\x00", full[off:off + 4].hex()
                  machine = struct.unpack_from("<H", full, off + 4)[0]
                  assert machine == aval, hex(machine)
                  arch = "PE machine " + hex(machine)
              xok = None
              if aext == "tar.gz":
                  xok = os.access(fx, os.X_OK)
                  assert xok, "execute permission lost after extraction"
              h = hashlib.sha256(open(arc, "rb").read()).hexdigest()
              return {"archive": os.path.basename(arc), "archive_bytes": os.path.getsize(arc),
                      "sha256": h, "entries": entries, "extracted": got, "arch": arch,
                      "exec_ok": xok, "exe_bytes": len(full)}
          try:
              res = verify()
          except AssertionError as e:
              print("::notice title=" + title + "_FAIL::" + esc(repr(e)))
              raise SystemExit(1)
          print("::notice title=" + title + "::" + esc(json.dumps(res)))
          PY
      - name: Stage 6
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AArch64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1
          path: ${{ runner.temp }}/ci-work/dist/AArch64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1.tar.gz
          retention-days: 7
          if-no-files-found: error
