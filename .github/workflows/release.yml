      - name: Stage 4
        run: |
          set -e
          GW="${RUNNER_TEMP}/ci-work"
          mkdir -p "${GW}/gate-stage" "${GW}/gate-dist"
          cp /tmp/ci-work/isolated-run/x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1 "${GW}/gate-stage/x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1"
          chmod 755 "${GW}/gate-stage/x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1"
          PYBIN="$(command -v python3 || command -v python)"
          "$PYBIN" - "x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1" "" "tar.gz" "${GW}" "elf" "0x3E" "PKG_GATE" << 'PY'
          import hashlib, json, os, shutil, struct, sys, tarfile, zipfile
          def esc(m):
              return str(m).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")[:3800]
          job, ext, aext, ciw, kind, aval_s, title = sys.argv[1:8]
          aval = int(aval_s, 0)
          stage = os.path.join(ciw, "gate-stage")
          dist = os.path.join(ciw, "gate-dist")
          exe = job + ext
          arc = os.path.join(dist, job + "." + aext)
          src = os.path.join(stage, exe)
          def verify():
              assert os.path.isfile(src), "staged executable missing: " + src
              assert os.path.getsize(src) > 0, "staged executable empty"
              if aext == "tar.gz":
                  with tarfile.open(arc, "w:gz") as t:
                      t.add(src, arcname=exe)
              else:
                  with zipfile.ZipFile(arc, "w", zipfile.ZIP_DEFLATED) as z:
                      z.write(src, arcname=exe)
              if aext == "tar.gz":
                  with tarfile.open(arc) as t:
                      ms = t.getmembers()
                      entries = [[m.name, m.isreg(), m.size, oct(m.mode & 0o777)] for m in ms]
                      assert len(ms) == 1, entries
                      m0 = ms[0]
                      assert m0.name == exe and m0.isreg() and m0.size > 0 and "/" not in m0.name, entries
                      assert m0.mode & 0o111, entries
              else:
                  with zipfile.ZipFile(arc) as z:
                      zs = z.infolist()
                      entries = [[i.filename, not i.is_dir(), i.file_size, oct((i.external_attr >> 16) & 0o777)] for i in zs]
                      assert len(zs) == 1, entries
                      i0 = zs[0]
                      assert i0.filename == exe and not i0.is_dir() and i0.file_size > 0 and "/" not in i0.filename, entries
              vd = os.path.join(ciw, "gate-verify")
              shutil.rmtree(vd, ignore_errors=True)
              os.makedirs(vd)
              if aext == "tar.gz":
                  with tarfile.open(arc) as t:
                      try:
                          t.extractall(vd, filter="data")
                      except TypeError:
                          t.extractall(vd)
              else:
                  with zipfile.ZipFile(arc) as z:
                      z.extractall(vd)
              got = sorted(os.listdir(vd))
              assert got == [exe], got
              fx = os.path.join(vd, exe)
              assert os.path.isfile(fx), got
              assert not [e for e in got if os.path.isdir(os.path.join(vd, e))], got
              full = open(fx, "rb").read()
              assert len(full) > 0, "extracted file empty"
              if kind == "elf":
                  assert full[:4] == b"\x7fELF", full[:8].hex()
                  machine = struct.unpack_from("<H", full, 18)[0]
                  assert machine == aval, hex(machine)
                  arch = "ELF e_machine " + hex(machine)
              elif kind == "macho":
                  magic = struct.unpack_from("<I", full, 0)[0]
                  assert magic in (0xFEEDFACF, 0xCFFAEDFE), hex(magic)
                  cputype = struct.unpack_from("<I", full, 4)[0]
                  assert cputype == aval, hex(cputype)
                  arch = "Mach-O cputype " + hex(cputype)
              else:
                  assert full[:2] == b"MZ", full[:2].hex()
                  off = struct.unpack_from("<I", full, 0x3C)[0]
                  assert full[off:off + 4] == b"PE\x00\x00", full[off:off + 4].hex()
                  machine = struct.unpack_from("<H", full, off + 4)[0]
                  assert machine == aval, hex(machine)
                  arch = "PE machine " + hex(machine)
              xok = None
              if aext == "tar.gz":
                  xok = os.access(fx, os.X_OK)
                  assert xok, "execute permission lost after extraction"
              h = hashlib.sha256(open(arc, "rb").read()).hexdigest()
              return {"archive": os.path.basename(arc), "archive_bytes": os.path.getsize(arc),
                      "sha256": h, "entries": entries, "extracted": got, "arch": arch,
                      "exec_ok": xok, "exe_bytes": len(full)}
          try:
              res = verify()
          except AssertionError as e:
              print("::notice title=" + title + "_FAIL::" + esc(repr(e)))
              raise SystemExit(1)
          print("::notice title=" + title + "::" + esc(json.dumps(res)))
          PY

