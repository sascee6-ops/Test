name: release

on:
  push:
    branches:
      - arena/2494d094-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag_linux:
    name: Linux Stage 0 Diagnostic (temporary)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Stage 0
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          P="linux"
          D="${RUNNER_TEMP}/diag"
          echo "::notice title=DIAG_ENV_${P}::pwd=$(pwd) sha=${GITHUB_SHA} ref=${GITHUB_REF_NAME} gitv=$(git --version) home=${HOME} ls=$(ls -A . | tr '\n' ',')"
          cfg=$(git config --list --show-origin --system --global 2>&1 | head -16 | tr '\n' ';')
          echo "::notice title=DIAG_CFG_${P}::${cfg:0:1400}"
          rm -rf "$D/a" "$D/b" "$D/c"; mkdir -p "$D/a" "$D/b" "$D/c"
          cd "$D/a"; git init -q .
          out=$(git -c http.extraHeader="Authorization: Bearer ${GITHUB_TOKEN}" fetch --depth 1 https://github.com/sascee6-ops/Test.git "${GITHUB_SHA}" 2>&1); rc=$?
          echo "::notice title=DIAG_A_BEARER_${P}::rc=${rc} out=${out:0:1200}"
          if [ $rc -ne 0 ]; then out=$(GIT_CURL_VERBOSE=1 git -c http.extraHeader="Authorization: Bearer ${GITHUB_TOKEN}" ls-remote https://github.com/sascee6-ops/Test.git HEAD 2>&1); echo "::notice title=DIAG_A_VERBOSE_${P}::${out:0:2800}"; fi
          cd "$D/b"; git init -q .; git remote add origin https://github.com/sascee6-ops/Test.git
          out=$(git fetch --depth 1 origin "${GITHUB_SHA}" 2>&1); rc=$?
          echo "::notice title=DIAG_B_ANON_REMOTE_${P}::rc=${rc} out=${out:0:800}"
          out2=$(git checkout --detach FETCH_HEAD 2>&1); rc2=$?
          echo "::notice title=DIAG_B_CHECKOUT_${P}::rc=${rc2} out=${out2:0:400}"
          cd "$D/c"; git init -q .
          out=$(git fetch --depth 1 https://github.com/sascee6-ops/Test.git "${GITHUB_SHA}" 2>&1); rc=$?
          echo "::notice title=DIAG_C_ANON_INLINE_${P}::rc=${rc} out=${out:0:800}"
          out2=$(git checkout --detach FETCH_HEAD 2>&1); rc2=$?
          echo "::notice title=DIAG_C_CHECKOUT_${P}::rc=${rc2} out=${out2:0:400}"
